<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b6b47">
<title>Cremería POS</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Cremería POS","short_name":"POS","display":"standalone","background_color":"#1b6b47","theme_color":"#1b6b47","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%231b6b47%27/%3E%3Ctext x=%2750%27 y=%2766%27 font-size=%2756%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27bold%27%3EP%3C/text%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>
<style>
:root{--bg:#f3f5f2;--surf:#fff;--surf2:#eaefea;--ink:#16201b;--mut:#5f6e66;--line:#d9e1da;--pri:#1b6b47;--pri-ink:#fff;--pri-soft:#ddf0e5;--acc:#f0a81f;--acc-soft:#fff0cc;--bad:#c23b2e;--bad-soft:#fde4e0;--warn:#a86a00;--warn-soft:#fdefcf;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1511;--surf:#18211c;--surf2:#212c26;--ink:#e9f0ea;--mut:#9aaaa0;--line:#2c3a32;--pri:#43b27e;--pri-ink:#06150d;--pri-soft:#163225;--acc:#f3b83c;--acc-soft:#3a2f12;--bad:#ef6e60;--bad-soft:#3d1b17;--warn:#f0b94f;--warn-soft:#3a2f12;color-scheme:dark}}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--pri)}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px}h3{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);font-weight:650;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#2b1d00}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.soft{background:var(--pri-soft);border-color:transparent;color:var(--pri)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{min-height:54px;font-size:17px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sm .ic{width:16px;height:16px}
/* shell */
#app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
#side{background:var(--surf);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.brand{font-weight:800;font-size:16px;padding:4px 8px 12px;line-height:1.15;display:flex;gap:10px;align-items:center}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:620;color:var(--mut);border:0;background:none;text-align:left;width:100%;position:relative}
.nav:hover{background:var(--surf2)}
.nav.on{background:var(--pri-soft);color:var(--pri)}
.nav .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
#wrap{display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surf);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .sp{flex:1}
#main{flex:1;overflow:auto;padding:14px;min-height:0}
#main.fit{overflow:hidden}
#tabs{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--surf2);font-size:12.5px;font-weight:650;border:0;cursor:pointer;color:var(--ink)}
.pill.ok{background:var(--pri-soft);color:var(--pri)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill .ic{width:14px;height:14px}
/* generic */
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.b{font-weight:700}.r{text-align:right}.c{text-align:center}
.num{font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:12.5px;font-weight:650;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hd h2{flex:1;min-width:140px}
.seg{display:inline-flex;background:var(--surf2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:650;color:var(--mut);cursor:pointer;min-height:36px}
.seg button.on{background:var(--surf);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.fill{display:grid;width:100%}.seg.fill button{padding:7px 2px;min-width:0;font-size:13.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surf2);color:var(--mut)}
.badge.ok{background:var(--pri-soft);color:var(--pri)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.acc{background:var(--acc-soft);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;cursor:pointer;min-width:0;text-align:left;width:100%}
.item:hover{border-color:var(--pri)}
.av{width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;font-size:16px}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:28px;border-radius:16px}
.kpi{padding:14px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:650}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.scroll-x{overflow-x:auto}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--surf2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
.sticky-search{display:flex;gap:8px}
.hint{background:var(--acc-soft);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:13px}
.mapl{color:var(--pri);font-weight:650;text-decoration:none}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,14,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{background:var(--bg);border-radius:16px;width:min(560px,100%);max-height:calc(100dvh - 28px);overflow:auto;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sheet.wide{width:min(860px,100%)}
.sheet .mh{display:flex;align-items:center;gap:10px}
.sheet .mh h2{flex:1}
.sheet .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-16px;background:var(--bg);padding:10px 0 2px}
#toasts{position:fixed;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:520px}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--acc);color:#2b1d00}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:minmax(0,1fr);gap:14px;height:100%;min-height:0}
.pos-l{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.cats button{border:1.5px solid var(--line);background:var(--surf);border-radius:99px;padding:6px 13px;font-weight:650;white-space:nowrap;cursor:pointer;color:var(--mut)}
.cats button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.catalog{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px;align-content:start;grid-auto-rows:max-content;padding-bottom:84px}
.pcard{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;position:relative}
.pcard:active{transform:scale(.98)}
.pcard .im{height:84px;flex:none;background:var(--surf2);display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:26px;color:#fff}
.pcard .im img{width:100%;height:100%;object-fit:cover}
.pcard .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .nm{font-weight:650;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.pcard .pr{font-weight:800;font-size:16px;color:var(--pri)}
.pcard .st{position:absolute;top:6px;left:6px}
.pcard .gr{position:absolute;top:6px;right:6px}
.pos-r{background:var(--surf);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.cart-h{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.cart-l{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.line{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.line .t{display:flex;gap:8px;align-items:flex-start}
.line .t .n{flex:1;font-weight:650;line-height:1.2;min-width:0}
.line .q{display:flex;align-items:center;gap:6px}
.line .q input{min-height:38px;padding:4px 6px;text-align:center;font-weight:700;width:76px}
.line .q .pp{width:92px;text-align:right}
.line .q .btn{min-height:38px;min-width:38px;padding:0}
.line .q .tot{margin-left:auto;font-weight:800;font-size:16px}
.line .neg{border-color:var(--acc);background:var(--acc-soft)}
.cart-f{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl.big{font-size:24px;font-weight:800}
.cartbar{display:none}
@media(max-width:1000px){
.pos{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.pos-r{position:fixed;inset:0;z-index:60;border-radius:0;transform:translateY(100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0)}
.pos-r.open{transform:none}
.cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--pri);color:var(--pri-ink);border-radius:14px;padding:12px 16px;align-items:center;gap:10px;font-weight:800;box-shadow:var(--shadow);border:0;font-size:16px;cursor:pointer}
}
@media(max-width:860px){
#app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
#side{display:none}
#wrap{grid-row:1}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0);grid-row:2}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:650;color:var(--mut);cursor:pointer;min-height:58px}
#tabs button.on{color:var(--pri)}
#main{padding:10px}
.sheet{max-height:calc(100dvh - 20px)}
.modal{padding:10px;align-items:flex-end}
.sheet{border-bottom-left-radius:0;border-bottom-right-radius:0;width:100%}
#toasts{bottom:140px}
}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.moregrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surf);font-weight:650;cursor:pointer}
/* scanner */
.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .guide{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanbox .guide:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#ff4d3d}
/* ticket */
.ticket{background:#fff;color:#000;font:12px/1.35 "Courier New",ui-monospace,monospace;padding:10px;width:100%;max-width:330px;margin:0 auto}
.ticket.w58{max-width:240px}
.ticket .c{text-align:center}.ticket .hr{border-top:1px dashed #000;margin:6px 0}
.ticket .l{display:flex;justify-content:space-between;gap:6px}
.ticket .l b{font-weight:700}
.ticket img.lg{max-width:60%;max-height:60px;display:block;margin:0 auto 4px}
.ticket .big{font-size:15px;font-weight:700}
#printArea{display:none}
@media print{
body{overflow:visible!important;background:#fff}
body>*:not(#printArea){display:none!important}
#printArea{display:block!important}
#printArea .ticket{max-width:none;width:100%;padding:0}
html,body,#root{height:auto!important;min-height:0!important;overflow:hidden!important}
}
.cartclose{display:none}
@media(max-width:1000px){.cartclose{display:inline-flex}}
@media(max-width:620px){.hide-s{display:none}}
code{background:var(--surf2);padding:1px 5px;border-radius:5px}
details summary{padding:6px 0}
</style>
<style id="pageStyle">@page{margin:0}</style>

<script>
'use strict';
/* ============ utilidades ============ */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtD=d=>{try{return new Date(d+(String(d).length===10?'T12:00:00':'')).toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'})}catch{return d||''}};
const LS={get(k,d=null){try{const v=localStorage.getItem('pos_'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('pos_'+k,JSON.stringify(v))}catch{}}};

const TABLES=['productos','clientes','proveedores','precios_prov','ventas','pagos','compras','movimientos','visitas','cajas','caja_mov','usuarios','config'];
const mem={};let idb=null,dirtyHook=()=>{};
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej('sin IndexedDB');const r=indexedDB.open('cremeria_pos',1);r.onupgradeneeded=()=>{const d=r.result;TABLES.forEach(t=>{if(!d.objectStoreNames.contains(t))d.createObjectStore(t,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadAll(){
  try{idb=await idbOpen()}catch(e){idb=null;console.warn('IndexedDB no disponible',e)}
  for(const t of TABLES){mem[t]=new Map();if(!idb)continue;const rows=await new Promise(r=>{const q=idb.transaction(t).objectStore(t).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])});rows.forEach(x=>mem[t].set(x.id,x))}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
}
function save(t,rec,raw){if(!rec.id)rec.id=uid();if(!raw)rec.updated=Date.now();mem[t].set(rec.id,rec);if(idb){try{idb.transaction(t,'readwrite').objectStore(t).put(rec)}catch(e){console.warn(e)}}if(!raw)dirtyHook();return rec}
const all=t=>[...mem[t].values()].filter(r=>!r.deleted);
const get=(t,id)=>{const r=mem[t].get(id);return r&&!r.deleted?r:null};
const del=(t,id)=>{const r=mem[t].get(id);if(r){r.deleted=1;save(t,r)}};
function wipeAll(){return Promise.all(TABLES.map(t=>{mem[t]=new Map();return new Promise(r=>{if(!idb)return r();const q=idb.transaction(t,'readwrite').objectStore(t).clear();q.onsuccess=q.onerror=()=>r()})}))}

const modals=[];
function modal(html,o={}){
  const el=document.createElement('div');el.className='modal';el.innerHTML=`<div class="sheet ${o.wide?'wide':''}">${html}</div>`;document.body.appendChild(el);
  const m={el,do:{},q:s=>el.querySelector(s),qa:s=>[...el.querySelectorAll(s)],close(){if(!el.isConnected)return;el.remove();const i=modals.indexOf(m);if(i>=0)modals.splice(i,1);o.onClose&&o.onClose()}};

function imgFile(file,max=200,type='image/jpeg'){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

let loc=null;
function getLoc(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now(),acc:p.coords.accuracy};res(loc)},()=>res(loc),{enableHighAccuracy:true,timeout:9000,maximumAge:30000})})}
const locFresh=(ms=300000)=>loc&&Date.now()-loc.ts<ms?loc:null;
function dist(a,b){if(!a||!b||a.lat==null||b.lat==null||a.lng==null||b.lng==null||a.lat===''||b.lat==='')return null;const R=6371000,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng),s=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
const fmtDist=m=>m==null?'':m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km';
const hasLL=r=>r&&r.lat!==undefined&&r.lat!==''&&r.lat!==null&&r.lng!==undefined&&r.lng!==''&&r.lng!==null&&!isNaN(+r.lat);
function mapUrl(r){if(hasLL(r))return`https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}`;if(r&&r.direccion)return`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.direccion)}`;return''}
function routeUrl(r){if(hasLL(r))return`https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;if(r&&r.direccion)return`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(r.direccion)}`;return''}
function touchUserLoc(force){const l=locFresh(600000);if(!l||!CU)return;const last=LS.get('uloc',0);if(!force&&Date.now()-last<300000)return;LS.set('uloc',Date.now());const u=get('usuarios',CU.id);if(u){u.ult_lat=l.lat;u.ult_lng=l.lng;u.ult_ts=new Date().toISOString();save('usuarios',u)}}

let zxP;
const loadZX=()=>zxP||(zxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>res(window.ZXing);s.onerror=()=>rej(new Error('sin red para cargar el lector'));document.head.appendChild(s)}));

function scanner(onCode,{continuous=false,title='Escanear código'}={}){
  let stream,stop=false,timer,last='',lastT=0,reader;
  const cleanup=()=>{stop=true;clearInterval(timer);try{stream&&stream.getTracks().forEach(t=>t.stop())}catch{}try{reader&&reader.reset()}catch{}};
  const m=modal(`${mhead(esc(title))}<div class="scanbox"><video id="scv" playsinline muted></video><div class="guide"></div></div><div class="sm mut" id="scmsg">Abriendo cámara… apunta al código de barras.</div><div class="row"><input id="scman" placeholder="O escribe el código y presiona Enter" autocomplete="off"><button class="btn pri" data-do="man">OK</button></div>${continuous?'<div class="mf"><button class="btn pri" data-close>Listo</button></div>':''}`,{sticky:true,onClose:cleanup});
  const got=c=>{c=String(c||'').trim();if(!c)return;const n=Date.now();if(c===last&&n-lastT<1800)return;last=c;lastT=n;beep();navigator.vibrate&&navigator.vibrate(50);if(!continuous)m.close();onCode(c)};
  const man=m.q('#scman');m.do.man=()=>{got(man.value);man.value=''};man.addEventListener('keydown',e=>{if(e.key==='Enter')m.do.man()});

      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
      if(stop){cleanup();return}
      v.srcObject=stream;await v.play();msg.textContent=continuous?'Escaneo continuo: cada código se agrega solo.':'Apunta al código de barras.';
      if('BarcodeDetector' in window){const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});timer=setInterval(async()=>{if(stop||v.readyState<2)return;try{const r=await det.detect(v);if(r.length)got(r[0].rawValue)}catch{}},180)}

    }catch(e){msg.textContent='No se pudo usar la cámara ('+(e&&(e.name||e.message)||'error')+'). Escribe el código a mano o usa un lector USB/Bluetooth.'}

const METODOS={efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia',credito:'Crédito'};
const pagosDe=vid=>all('pagos').filter(p=>p.venta_id===vid&&!p.cancelado).sort((a,b)=>(a.fecha||'')<(b.fecha||'')?-1:1);
const pagadoDe=vid=>r2(sumBy(pagosDe(vid),p=>p.monto));
function ticketModel(v,pago){
  const c=cfg(),R=[],cl=v.cliente_id&&get('clientes',v.cliente_id),esAbono=pago&&pago.tipo==='abono',ps=pagosDe(v.id);
  if(c.logo){R.push({t:'logo',src:c.logo});R.push({t:'cb',text:String(c.negocio||'').toUpperCase()})}else R.push({t:'c',text:c.negocio,big:1});
  String(c.direccion||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>R.push({t:'c',text:l}));
  if(c.telefono)R.push({t:'c',text:'Tel: '+c.telefono});
  R.push({t:'hr'});
  if(esAbono)R.push({t:'c',big:1,text:'RECIBO DE ABONO'});else if(v.cancelada)R.push({t:'c',big:1,text:'VENTA CANCELADA'});else if(v.estado!=='pagada')R.push({t:'c',big:1,text:'NOTA · '+(v.estado==='credito'?'CRÉDITO':'PENDIENTE')});
  R.push({t:'kv',a:'Tkt',b:v.folio,big:1});R.push({t:'kv',a:'Fecha',b:fmtDT(esAbono?pago.fecha:v.fecha)});
  R.push({t:'kv',a:'Cliente',b:cl?cl.nombre:(v.cliente_nombre||'PÚBLICO GENERAL')});
  R.push({t:'hr'});
  if(!esAbono){
    const rec=r2(sumBy(ps,p=>p.recargo)),mets=[...new Set(ps.filter(p=>p.monto>0).map(p=>p.metodo))];
    const its=v.items||[],tot=r2(v.total+rec),ratio=v.total>0?tot/v.total:1,subC=rec?r2(v.subtotal*ratio):v.subtotal,imps=rec?cardScale(its.map(i=>i.importe),subC):its.map(i=>i.importe);
    R.push({t:'l',text:'Nombre'});R.push({t:'l',text:'Cant x Precio          Importe'});R.push({t:'hr'});

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
function ticketLayout(R,W){
  const c=document.createElement('canvas').getContext('2d'),fs=(+cfg().ticket_fs||24)+(W>384?2:0),big=fs+6,LH=fs+6,ops=[];let y=6;
  const font=(s,b)=>`bold ${s}px "Courier New", monospace`;
  const wrap=(t,f)=>{c.font=f;const out=[];let cur='';for(const w of String(t).split(' ')){const x=cur?cur+' '+w:w;if(c.measureText(x).width>W-8&&cur){out.push(cur);cur=w}else cur=x}if(cur)out.push(cur);return out};
  for(const r of R){
    if(r.t==='logo'){ops.push({k:'logo',src:r.src,y});y+=W>384?120:108}
    else if(r.t==='c'||r.t==='cb'){const b=r.big||r.t==='cb';let sz=r.big?big:fs;c.font=font(sz,b);const mn=Math.round(sz*.75);while(c.measureText(r.text).width>W-8&&sz>mn){sz--;c.font=font(sz,b)}const f=font(sz,b);wrap(r.text,f).forEach(l=>{ops.push({k:'t',x:W/2,y,txt:l,f,a:'center'});y+=sz+(r.big?6:1)})}
    else if(r.t==='hr'){ops.push({k:'hr',y:y+LH/2-1});y+=LH}
    else if(r.t==='kv'){const f=font(r.big?fs+2:fs,r.big);c.font=f;const bw=c.measureText(r.b).width,a=String(r.a);if(c.measureText(a).width>W-bw-16){wrap(a,f).forEach(l=>{ops.push({k:'t',x:4,y,txt:l,f,a:'left'});y+=LH});let vs=r.big?fs+2:fs;c.font=font(vs,r.big);while(c.measureText(r.b).width>W-8&&vs>12){vs--;c.font=font(vs,r.big)}ops.push({k:'t',x:W-4,y,txt:r.b,f:font(vs,r.big),a:'right'});y+=LH+(r.big?2:0)}else{ops.push({k:'t',x:4,y,txt:a,f,a:'left'},{k:'t',x:W-4,y,txt:r.b,f,a:'right'});y+=LH+(r.big?2:0)}}
    else if(r.t==='l'){const m=String(r.text).match(/^(.*?)\s{3,}(\S+)$/);let f=font(fs,false);if(m){let hs=fs;c.font=f;while(c.measureText(m[1]).width+c.measureText(m[2]).width+16>W&&hs>12){hs--;f=font(hs,false);c.font=f}ops.push({k:'t',x:4,y,txt:m[1],f,a:'left'},{k:'t',x:W-4,y,txt:m[2],f,a:'right'})}else ops.push({k:'t',x:4,y,txt:r.text,f,a:'left'});y+=LH}
    else if(r.t==='item'){const f=font(fs,true);wrap(r.name,f).forEach(l=>{ops.push({k:'t',x:4,y,txt:l,f,a:'left'});y+=LH});const f2=font(fs,false);c.font=f2;if(c.measureText(r.det).width+c.measureText(r.imp).width+24>W){ops.push({k:'t',x:12,y,txt:r.det,f:f2,a:'left'});y+=LH;ops.push({k:'t',x:W-4,y,txt:r.imp,f:f2,a:'right'});y+=LH}else{ops.push({k:'t',x:12,y,txt:r.det,f:f2,a:'left'},{k:'t',x:W-4,y,txt:r.imp,f:f2,a:'right'});y+=LH}}
  }
  return{ops,H:y+10}}
async function ticketCanvas(R){
  const W=cfg().papel==='80'?576:384,{ops,H}=ticketLayout(R,W),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.textBaseline='top';
  for(const o of ops){
    if(o.k==='t'){x.font=o.f;x.textAlign=o.a;x.fillText(o.txt,o.x,o.y)}
    else if(o.k==='hr'){for(let i=0;i<W;i+=10)x.fillRect(i,o.y,6,3)}}

  const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const v=d[i]*.3+d[i+1]*.59+d[i+2]*.11<215?0:255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}x.putImageData(id,0,0);

const BT={dev:null,ch:null};
async function btConnect(){
  if(BT.ch&&BT.dev&&BT.dev.gatt.connected)return BT.ch;
  if(!navigator.bluetooth)throw new Error('Este navegador no permite Bluetooth. Usa Chrome en Android o en PC.');
  const dev=BT.dev||await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xFFE0,0xFF00,0xFF02,0xFEE7,0xAE30,0xAF30,'000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455']});
  const srv=await dev.gatt.connect();let ch=null;
  for(const s of await srv.getPrimaryServices()){for(const c of await s.getCharacteristics()){if(c.properties.writeWithoutResponse||c.properties.write){ch=c;break}}if(ch)break}
  if(!ch)throw new Error('No encontré cómo enviar datos a esa impresora');
  BT.dev=dev;BT.ch=ch;return ch}
async function btPrint(R){
  const ch=await btConnect(),cv=await ticketCanvas(R),W=cv.width,H=cv.height,wb=W/8,d=cv.getContext('2d').getImageData(0,0,W,H).data,bytes=new Uint8Array(wb*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i]*.3+d[i+1]*.59+d[i+2]*.11<150)bytes[y*wb+(x>>3)]|=0x80>>(x&7)}
  const send=async u=>{for(let i=0;i<u.length;i+=120){const part=u.slice(i,i+120);ch.properties.writeWithoutResponse?await ch.writeValueWithoutResponse(part):await ch.writeValue(part);await new Promise(r=>setTimeout(r,12))}};
  await send(new Uint8Array([0x1b,0x40]));
  for(let y0=0;y0<H;y0+=128){const h=Math.min(128,H-y0),head=new Uint8Array([0x1d,0x76,0x30,0x00,wb&255,wb>>8,h&255,h>>8]),body=bytes.subarray(y0*wb,(y0+h)*wb),buf=new Uint8Array(head.length+body.length);buf.set(head);buf.set(body,head.length);await send(buf)}
  await send(new Uint8Array([0x0a,0x0a,0x0a]))}

function renderShell(){
  const c=cfg();
  $('#root').innerHTML=`<div id="app"><aside id="side"><div class="brand"><div class="logo">${c.logo?`<img src="${esc(c.logo)}" alt="">`:'P'}</div><div>${esc(c.negocio)}</div></div>${NAV.filter(n=>can(n[0])).map(n=>`<button class="nav" data-v="${n[0]}">${ic(n[2])}<span>${n[1]}</span><span class="dot" hidden></span></button>`).join('')}</aside><div id="wrap"><div id="top"></div><div id="main"></div></div><nav id="tabs">${TABV.filter(t=>t[0]==='mas'||can(t[0])).map(t=>`<button data-v="${t[0]}">${ic(t[2])}<span>${t[1]}</span></button>`).join('')}</nav></div>`;
  $('#app').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;if(b.dataset.v==='mas')moreMenu();else go(b.dataset.v)});
}
function moreMenu(){const m=modal(`${mhead('Menú')}<div class="moregrid">${NAV.filter(n=>can(n[0])).map(n=>`<button data-do="g" data-v2="${n[0]}">${ic(n[2])}<span>${n[1]}</span></button>`).join('')}</div><button class="btn block" data-do="out">${ic('user')} ${esc(U().nombre)} · cambiar usuario / salir</button>`);m.do.g=b=>{m.close();go(b.dataset.v2)};m.do.out=()=>{m.close();logout()}}
function go(v,arg){
  if(!can(v)){toast('No tienes permiso para esta sección','bad');return}
  view=v;LS.set('view',v);
  $$('#side .nav').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(b.dataset.v==='mas'&&!TABV.some(t=>t[0]===v))));
  const mn=$('#main');mn.classList.toggle('fit',v==='pos');mn.scrollTop=0;
  try{(V[v]||(()=>{}))(arg)}catch(e){console.error(e);mn.innerHTML=`<div class="card">Error al abrir la sección: ${esc(e.message)}</div>`}
  renderTop();
}
function renderTop(){
  const t=$('#top');if(!t)return;
  const caja=myCaja(),al=alertCount(),tot=al.agotado+al.bajo,vieja=caja&&caja.dia!==today();
  const nd=$$('#side .nav').find(b=>b.dataset.v==='inventario');if(nd){const d=nd.querySelector('.dot');d.hidden=!tot;d.textContent=tot}
  t.innerHTML=`<h3>${esc(VTITLE[view]||'')}</h3><span class="sp"></span>
  ${can('caja')?`<button class="pill ${caja?(vieja?'warn':'ok'):'bad'}" data-t="caja">${ic('cash')}${caja?(vieja?'Caja de otro día':'Caja abierta'):'Caja cerrada'}</button>`:''}
  ${tot&&can('inventario')?`<button class="pill ${al.agotado?'bad':'warn'}" data-t="inv">${ic('alert')}${al.agotado?al.agotado+' agotados':''}${al.agotado&&al.bajo?' · ':''}${al.bajo?al.bajo+' bajos':''}</button>`:''}
  <button class="pill ${SYNC.state==='err'?'bad':SYNC.state==='off'?'':'ok'}" data-t="sync">${ic('cloud')}${SYNC.state==='off'?'Sin Sheets':SYNC.state==='busy'?'Sincronizando…':SYNC.state==='err'?'Error sync':SYNC.pend?SYNC.pend+' por enviar':'Sincronizado'}</button>
  <button class="pill" data-t="user">${ic('user')}${esc(U().nombre)}</button>`;
  t.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const k=b.dataset.t;if(k==='caja')go('caja');else if(k==='inv')go('inventario','alertas');else if(k==='sync')(SYNC.state==='off'?(can('ajustes')?go('ajustes','datos'):toast('Configura la sincronización en Ajustes (administrador)','warn')):syncNow(true));else if(k==='user')userMenu()};
}
function userMenu(){const m=modal(`${mhead(esc(U().nombre))}<div class="mut sm">Rol: ${esc(U().rol)} · Dispositivo: ${esc(DEV)}</div><div class="list"><button class="btn" data-do="loc">${ic('pin')} Actualizar mi ubicación</button><button class="btn" data-do="out">${ic('lock')} Cambiar usuario / Cerrar sesión</button></div>`);m.do.loc=async()=>{toast('Buscando ubicación…');const l=await getLoc();if(l){touchUserLoc(true);toast('Ubicación actualizada')}else toast('No se pudo obtener la ubicación. Revisa el permiso del navegador.','bad');m.close()};m.do.out=()=>{m.close();logout()}}
function logout(){LS.set('ses','');CU=null;loginScreen()}
function loginScreen(){
  const us=all('usuarios').filter(u=>u.activo!==0).sort((a,b)=>a.nombre.localeCompare(b.nombre));let sel=null,pin='';
  const draw=()=>{$('#root').innerHTML=`<div style="height:100%;overflow:auto;display:grid;place-items:center;padding:16px"><div class="card" style="width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)">
  <div class="brand" style="padding:0"><div class="logo">${cfg().logo?`<img src="${esc(cfg().logo)}" alt="">`:'P'}</div><div>${esc(cfg().negocio)}</div></div>
  ${!sel?`<h3>¿Quién va a vender?</h3><div class="list">${us.map(u=>`<button class="item" data-u="${u.id}">${avatar(u)}<div class="sp"><div class="b">${esc(u.nombre)}</div><div class="xs mut">${esc(u.rol)}</div></div></button>`).join('')}</div>${us.length===1&&us[0].nombre==='Administrador'&&us[0].pin===hashPin('1234')?'<div class="hint">Primer uso: entra como Administrador con PIN 1234 y cámbialo en Ajustes.</div>':''}`
  :`<div class="row">${avatar(sel)}<div class="sp"><div class="b">${esc(sel.nombre)}</div><button class="btn sm ghost" data-back>Cambiar</button></div></div><div class="c b num" style="font-size:28px;letter-spacing:.4em;min-height:40px">${'●'.repeat(pin.length)||'<span class="mut" style="font-size:14px;letter-spacing:0">Escribe tu PIN</span>'}</div><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button class="btn lg ${k==='OK'?'pri':''}" data-k="${k}">${k}</button>`).join('')}</div>`}
  </div></div>`;
    $$('[data-u]').forEach(b=>b.onclick=()=>{sel=get('usuarios',b.dataset.u);pin='';if(!sel.pin){enter(sel);return}draw()});
    const bk=$('[data-back]');if(bk)bk.onclick=()=>{sel=null;draw()};
    $$('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')pin=pin.slice(0,-1);else if(k==='OK'){if(hashPin(pin)===sel.pin)return enter(sel);toast('PIN incorrecto','bad');pin=''}else pin+=k;draw()})};
  const enter=u=>{CU=u;LS.set('ses',u.id);boot2()};
  const kd=e=>{if(!sel||!$('[data-k]')){return}if(/^\d$/.test(e.key)){pin+=e.key;draw()}else if(e.key==='Backspace'){pin=pin.slice(0,-1);draw()}else if(e.key==='Enter'){if(hashPin(pin)===sel.pin)enter(sel);else{toast('PIN incorrecto','bad');pin='';draw()}}};
  document.removeEventListener('keydown',window._kd||(()=>{}));window._kd=kd;document.addEventListener('keydown',kd);
  draw();
}
function boot2(){document.removeEventListener('keydown',window._kd||(()=>{}));renderShell();startTracking();go(can(LS.get('view','pos'))?LS.get('view','pos'):'pos');if(!boot2.once){boot2.once=1;setupLock();setupSync()}}

/* ============ inicio ============ */
V.inicio=()=>{
  const d=today(),own=U().rol==='vendedor',vs=all('ventas').filter(v=>v.dia===d&&!v.cancelada&&(!own||v.usuario_id===U().id));
  const porCobrar=r2(sumBy(all('ventas').filter(v=>!v.cancelada&&v.saldo>0.004),v=>v.saldo));
  const al=alertCount(),vis=all('visitas').filter(v=>v.fecha===d&&v.estado==='pendiente').length;
  const caja=myCaja();
  const lows=all('productos').filter(p=>p.activo!==0&&stStatus(p)!=='ok').sort((a,b)=>stockOf(a.id)-stockOf(b.id)).slice(0,8);
  const deb=all('clientes').map(c=>({c,s:r2(sumBy(all('ventas').filter(v=>v.cliente_id===c.id&&!v.cancelada&&v.saldo>0.004),v=>v.saldo))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);
  $('#main').innerHTML=`<div class="grid g3" style="margin-bottom:12px">
   <div class="kpi"><div class="l">Ventas de hoy</div><div class="v">${money(sumBy(vs,v=>v.total))}</div><div class="xs mut">${vs.length} ticket${vs.length===1?'':'s'}</div></div>
   <div class="kpi"><div class="l">Por cobrar (crédito y pendientes)</div><div class="v">${money(porCobrar)}</div><a class="mapl xs" href="#" data-g="cobranza">Ver cobranza</a></div>
   <div class="kpi"><div class="l">Alertas de inventario</div><div class="v">${al.agotado+al.bajo}</div><div class="xs mut">${al.agotado} agotados · ${al.bajo} stock bajo</div></div>
   <div class="kpi"><div class="l">Visitas pendientes hoy</div><div class="v">${vis}</div><a class="mapl xs" href="#" data-g="ruta">Ver ruta</a></div></div>
   ${caja&&caja.dia!==d?`<div class="hint" style="margin-bottom:12px">Tienes una caja abierta del ${esc(caja.dia)}. Ciérrala en <a href="#" class="mapl" data-g="caja">Caja</a>.</div>`:''}
   <div class="row wrap" style="margin-bottom:12px"><button class="btn pri lg" data-g="pos">${ic('cart')} Nueva venta</button>${can('caja')?`<button class="btn lg" data-g="caja">${ic('cash')} ${caja?'Ver caja':'Abrir caja'}</button>`:''}${can('compras')?`<button class="btn lg" data-g="compras">${ic('truck')} Registrar compra</button>`:''}</div>
   <div class="grid g2"><div class="card"><div class="hd"><h3>Existencias por atender</h3></div>${lows.length?`<div class="list">${lows.map(p=>`<div class="row"><div class="sp ell">${esc(p.nombre)}</div><span class="num b">${qf(stockOf(p.id))} ${esc(p.unidad||'')}</span>${stBadge(p)}</div>`).join('')}</div>`:'<div class="empty">Todo en orden. Ningún producto bajo el mínimo.</div>'}</div>
   <div class="card"><div class="hd"><h3>Clientes con saldo</h3></div>${deb.length?`<div class="list">${deb.map(x=>`<div class="row"><div class="sp ell">${esc(x.c.nombre)}</div><span class="num b">${money(x.s)}</span></div>`).join('')}</div>`:'<div class="empty">Sin saldos pendientes.</div>'}</div></div>`;
  $('#main').onclick=e=>{const g=e.target.closest('[data-g]');if(g){e.preventDefault();go(g.dataset.g)}};
};

/* ============ punto de venta ============ */
let cart={items:[],cliente_id:'',esquema:'menudeo',total_neg:null,venta_id:null};
let posQ='',posCat='';
const canEditPrice=()=>cfg().editar_precios==1||U().rol!=='vendedor';
function priceFor(p,qty,esq){const may=+p.mayoreo||0;if(may>0&&(esq==='mayoreo'||(+p.min_mayoreo>0&&qty>=+p.min_mayoreo)))return may;return +p.precio||0}
function cartCalc(){
  const lines=cart.items.map(it=>{const p=get('productos',it.pid)||{id:it.pid,nombre:'(producto eliminado)'};const lista=priceFor(p,it.qty,cart.esquema);const precio=it.pm!=null?it.pm:lista;return{it,p,lista,precio,importe:r2(it.qty*precio)}});
  const subtotal=r2(sumBy(lines,l=>l.importe));let base=subtotal;
  if(cart.total_neg!==null&&cart.total_neg!==''&&!isNaN(+cart.total_neg))base=r2(Math.max(0,+cart.total_neg));
  return{lines,subtotal,base,descuento:r2(subtotal-base)}}
function resetCart(){cart={items:[],cliente_id:'',esquema:'menudeo',total_neg:null,venta_id:null}}
function addToCart(pid,qty=1){
  const p=get('productos',pid);if(!p)return;
  let it=cart.items.find(i=>i.pid===pid);if(it)it.qty=Math.round((it.qty+qty)*1000)/1000;else cart.items.push({pid,qty:Math.round(qty*1000)/1000,pm:null});
  const have=stockOf(pid),want=cart.items.find(i=>i.pid===pid).qty;
  if(want>have){if(cfg().vender_sin_stock==1)toast(`Ojo: solo hay ${qf(have)} ${p.unidad||''} de ${p.nombre}`,'warn');else{cart.items.find(i=>i.pid===pid).qty=Math.max(0,have);toast('Sin existencia suficiente','bad')}}
  renderCart();}
function addProd(p){if(+p.granel)granelDialog(p);else addToCart(p.id,1)}
function granelDialog(p){
  let mode='qty';const esq=cart.esquema;
  const m=modal(`${mhead('A granel · '+esc(p.nombre))}<div class="row"><span class="badge ok">${money(priceFor(p,1,esq))} por ${esc(p.unidad||'kg')}</span><span class="badge">Existencia: ${qf(stockOf(p.id))} ${esc(p.unidad||'')}</span></div>
  <div class="seg"><button class="on" data-do="mq">Por cantidad (${esc(p.unidad||'kg')})</button><button data-do="mm">Por monto ($)</button></div>
  <div class="field"><label id="gl">Cantidad en ${esc(p.unidad||'kg')}</label><input id="gv" type="number" step="any" inputmode="decimal" min="0" style="font-size:26px;font-weight:800;min-height:58px" autofocus></div>
  <div class="row wrap">${[0.25,0.5,1,2].map(x=>`<button class="btn sm" data-do="qk" data-x="${x}">${x}</button>`).join('')}${presOf(p)?`<button class="btn sm acc" data-do="qk" data-x="${presOf(p).c}">1 ${esc(presOf(p).n)} (${qf(presOf(p).c)})</button>`:''}</div>
  <div class="card flat"><div class="tl"><span>Cantidad</span><b class="num" id="gq">0</b></div><div class="tl"><span>Importe</span><b class="num" id="gi">$0.00</b></div></div>
  <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn pri" data-do="ok">${ic('plus')} Agregar</button></div>`);
  const inp=m.q('#gv');setTimeout(()=>inp.focus(),60);
  const calc=()=>{const v=num(inp.value);let q=mode==='qty'?v:(priceFor(p,1,esq)>0?v/priceFor(p,1,esq):0);q=Math.round(q*1000)/1000;const pr=priceFor(p,q,esq);m.q('#gq').textContent=qf(q)+' '+(p.unidad||'');m.q('#gi').textContent=money(mode==='qty'?q*pr:v);return q};
  inp.addEventListener('input',calc);
  const setMode=x=>{mode=x;m.qa('.seg button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(x==='qty')));m.q('#gl').textContent=x==='qty'?`Cantidad en ${p.unidad||'kg'}`:'Monto que pide el cliente ($)';inp.value='';calc();inp.focus()};
  m.do.mq=()=>setMode('qty');m.do.mm=()=>setMode('monto');m.do.qk=b=>{mode==='qty'||setMode('qty');inp.value=b.dataset.x;calc()};
  m.do.ok=()=>{const q=calc();if(q<=0){toast('Escribe una cantidad','warn');return}m.close();addToCart(p.id,q)};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')m.do.ok()})}
function posFilter(){
  const q=norm(posQ),toks=q.split(/\s+/).filter(Boolean);
  let a=all('productos').filter(p=>p.activo!==0);
  if(posCat)a=a.filter(p=>(p.categoria||'')===posCat);
  if(toks.length)a=a.filter(p=>{const h=norm(p.nombre+' '+(p.categoria||'')+' '+(p.codigo||''));return toks.every(t=>h.includes(t))});
  return a.sort((x,y)=>x.nombre.localeCompare(y.nombre))}
function renderCatalog(){
  const a=posFilter(),el=$('#pcat');if(!el)return;
  el.innerHTML=a.length?a.slice(0,120).map(p=>{const s=stStatus(p),pr=priceFor(p,1,cart.esquema);return`<button class="pcard" data-p="${p.id}"><div class="im" style="${p.imagen?'':`background:hsl(${[...p.nombre].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,0)} 34% 42%)`}">${p.imagen?`<img src="${esc(p.imagen)}" alt="" loading="lazy">`:esc(p.nombre.slice(0,2).toUpperCase())}</div>${s!=='ok'?`<span class="st">${stBadge(p)}</span>`:''}${+p.granel?'<span class="gr badge acc">granel</span>':''}<div class="tx"><div class="nm">${esc(p.nombre)}</div><div class="pr num">${money(pr)}<span class="xs mut" style="font-weight:600"> /${esc(p.unidad||'pza')}</span></div><div class="xs mut num">${qf(stockOf(p.id))} disp.</div></div></button>`}).join(''):`<div class="empty" style="grid-column:1/-1">${posQ?'No hay productos con esa búsqueda.':'Aún no hay productos. Agrégalos en Productos o carga los de ejemplo en Ajustes.'}</div>`}
function renderCats(){const cats=[...new Set(all('productos').map(p=>p.categoria).filter(Boolean))].sort();const el=$('#pcats');if(!el)return;el.innerHTML=cats.length?`<button class="${posCat===''?'on':''}" data-c="">Todos</button>`+cats.map(c=>`<button class="${posCat===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join(''):''}
function renderCart(){
  const el=$('#pcart');if(!el)return;const c=cartCalc(),cl=cart.cliente_id&&get('clientes',cart.cliente_id),edit=cart.venta_id&&get('ventas',cart.venta_id),ep=canEditPrice();
  const nitems=cart.items.length,units=sumBy(cart.items,i=>i.qty);
  el.innerHTML=`<div class="cart-h"><div class="row"><button class="btn sm sp" data-a="cli" style="justify-content:flex-start">${ic('user')}<span class="ell">${cl?esc(cl.nombre):'Mostrador (sin cliente)'}</span></button><div class="seg"><button class="${cart.esquema==='menudeo'?'on':''}" data-a="esq" data-v="menudeo">Menudeo</button><button class="${cart.esquema==='mayoreo'?'on':''}" data-a="esq" data-v="mayoreo">Mayoreo</button></div><button class="btn sm ghost cartclose" data-a="hide" aria-label="Cerrar carrito">${ic('x')}</button></div>
  ${edit?`<div class="hint">Editando ${esc(edit.folio)} · ya pagado ${money(pagadoDe(edit.id))}. Agrega productos y guarda.</div>`:''}</div>
  <div class="cart-l">${c.lines.length?c.lines.map((l,i)=>{const neg=Math.abs(l.precio-l.lista)>0.001,gr=+l.p.granel;return`<div class="line"><div class="t"><div class="n">${esc(l.p.nombre)}${gr?' <span class="badge acc">granel</span>':''}<div class="xs mut">Lista ${money(l.lista)} / ${esc(l.p.unidad||'pza')}${l.it.qty>stockOf(l.p.id)?` · <span style="color:var(--bad)">existencia ${qf(stockOf(l.p.id))}</span>`:''}</div></div><button class="btn sm ghost" data-a="rm" data-i="${i}" aria-label="Quitar">${ic('trash')}</button></div>
  <div class="q"><button class="btn sm" data-a="dec" data-i="${i}">${ic('minus')}</button><input type="number" step="${gr?'any':'1'}" inputmode="decimal" value="${qf(l.it.qty)}" data-ci="qty" data-i="${i}" aria-label="Cantidad"><button class="btn sm" data-a="inc" data-i="${i}">${ic('plus')}</button>${presOf(l.p)?`<button class="btn sm acc" data-a="pres" data-i="${i}" title="Completar ${esc(presOf(l.p).n)} (${qf(presOf(l.p).c)})">${esc(presOf(l.p).n)}</button>`:''}${presOf(l.p)?`<button class="btn sm" data-a="presed" data-i="${i}" title="Cantidad en ${esc(presOf(l.p).n.toLowerCase())}s y piezas">${ic('edit')}</button>`:''}<span class="xs mut">×</span><input class="pp ${neg?'neg':''}" type="number" step="any" inputmode="decimal" value="${l.precio}" data-ci="pr" data-i="${i}" ${ep?'':'disabled'} aria-label="Precio unitario"><span class="tot num">${money(l.importe)}</span></div>${neg?`<div class="xs" style="color:var(--warn)">Precio negociado (lista ${money(l.lista)})</div>`:''}</div>`}).join(''):`<div class="empty">${ic('cart')}<div style="margin-top:6px">Toca un producto o escanea su código para agregarlo.</div></div>`}</div>
  <div class="cart-f"><div class="tl sm"><span>${nitems} partida${nitems===1?'':'s'} · ${qf(units)} unid.</span><span class="num">Subtotal ${money(c.subtotal)}</span></div>
  <div class="tl"><span class="sm">Total negociado</span><input id="tneg" type="number" step="any" inputmode="decimal" placeholder="${c.subtotal}" value="${cart.total_neg??''}" style="width:130px;text-align:right" ${ep?'':'disabled'}></div>
  ${c.descuento?`<div class="tl sm" style="color:var(--warn)"><span>${c.descuento>0?'Descuento':'Ajuste'}</span><b class="num">${money(-c.descuento)}</b></div>`:''}
  <div class="tl big"><span>Total</span><span class="num">${money(c.base)}</span></div>
  <div class="row"><button class="btn" data-a="clear" ${nitems?'':'disabled'}>Vaciar</button><button class="btn" data-a="hold" ${nitems?'':'disabled'}>Pendiente</button><button class="btn pri lg sp" data-a="pay" ${nitems?'':'disabled'}>Cobrar ${money(c.base)}</button></div></div>`;
  const cb=$('#cbar');if(cb){cb.innerHTML=`${ic('cart')}<span class="sp">${nitems?`${nitems} partida${nitems===1?'':'s'} · ${money(c.base)}`:'Carrito vacío'}</span><span>Ver ›</span>`}
}
V.pos=()=>{
  const mn=$('#main');
  mn.innerHTML=`<div class="pos"><div class="pos-l"><div class="sticky-search"><input id="pq" placeholder="Buscar por nombre o escanear código…" autocomplete="off" value="${esc(posQ)}"><button class="btn" id="pscan" aria-label="Escanear con cámara">${ic('scan')}<span class="hide-s">Cámara</span></button></div><div class="cats" id="pcats"></div><div class="catalog" id="pcat"></div></div><div class="pos-r" id="pcart"></div></div><button class="cartbar" id="cbar"></button>`;
  renderCats();renderCatalog();renderCart();
  const pq=$('#pq');
  pq.addEventListener('input',debounce(()=>{posQ=pq.value;renderCatalog()},120));
  pq.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=pq.value.trim();if(!v)return;const exact=all('productos').find(p=>p.codigo&&String(p.codigo)===v);
    if(exact){addProd(exact);pq.value='';posQ='';renderCatalog();return}
    const a=posFilter();if(a.length===1){addProd(a[0]);pq.value='';posQ='';renderCatalog();return}
    if(/^\d{6,}$/.test(v)){toast('Código no encontrado: '+v,'bad');if(canEditCat())ask(`¿Crear un producto con el código ${v}?`,'Crear').then(y=>{if(y)productForm(null,{codigo:v})})}});

const pedPend=()=>all('compras').filter(c=>c.estado==='pedido').length;
const riesgoPrecio=p=>+p.costo>0&&((+p.mayoreo>0&&+p.mayoreo<=+p.costo)||(+p.precio>0&&+p.precio<=+p.costo)||(+p.precio>0&&+p.mayoreo>+p.precio));
const presOf=p=>p&&p.pres_nombre&&+p.pres_cant>1?{n:p.pres_nombre,c:+p.pres_cant}:null;
const lf=l=>{const pr=presOf(get('productos',l.pid));return l.mode==='pres'&&pr?pr.c:1};
const lq=l=>Math.round(l.qty*lf(l)*1000)/1000;
const limp=l=>r2(lq(l)*(+l.costo||0));
const lunit=l=>{const p=get('productos',l.pid)||{},pr=presOf(p);return l.mode==='pres'&&pr?pr.n.toLowerCase()+'(s)':(p.unidad||'pza')};
function initMode(l,baseQty){const pr=presOf(get('productos',l.pid));if(pr){l.mode='pres';l.qty=baseQty!=null?Math.max(1,Math.ceil(baseQty/pr.c)):1}else{l.mode='base';l.qty=baseQty!=null?baseQty:1}return l}
const ageTxt=f=>{const d=Math.round((new Date(today())-new Date(String(f).slice(0,10)))/864e5);return isNaN(d)?'':d<=0?'cotizado hoy':d===1?'cotizado ayer':'cotizado hace '+d+' días'};

function rowsFor(l){const ps=preciosDe(l.pid),ids=new Set(ps.map(x=>x.proveedor_id));return ps.concat((l.extra||[]).filter(id=>!ids.has(id)&&get('proveedores',id)).map(id=>({proveedor_id:id,costo:'',fecha:''})))}
const lineTxt=(l,withPrice)=>{const p=get('productos',l.pid)||{nombre:'?'};return`• ${qf(l.qty)} ${lunit(l)} ${p.nombre}${l.mode==='pres'?' ('+qf(lq(l))+' '+(p.unidad||'')+')':''}${withPrice&&l.costo>0?' — '+money(l.costo*lf(l))+' c/u':''}`};

function askQuote(){const ls=draft.lines.filter(l=>l.qty>0);if(!ls.length)return;

  const rows=vs.map(({v,mine})=>{const arr=mine.length?mine:ls,text=`Hola, buen día. Soy de ${cfg().negocio}. ¿Me puedes cotizar por favor?\n\n${arr.map(l=>lineTxt(l,false)).join('\n')}\n\nGracias.`,n=waNumber(v.telefono);
    return`<div class="item" style="cursor:default"><div class="sp"><div class="b">${esc(v.nombre)}</div><div class="xs mut">${mine.length?`Maneja ${mine.length} de ${ls.length}`:'Aún no tiene estos productos'}</div></div>${n.length>=10?`<a class="btn sm" style="background:#25d366;color:#04210f;border-color:#25d366" href="https://wa.me/${n}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a>`:''}${v.email?`<a class="btn sm" href="mailto:${encodeURIComponent(v.email)}?subject=${encodeURIComponent('Cotización · '+cfg().negocio)}&body=${encodeURIComponent(text)}">Correo</a>`:''}${n.length<10&&!v.email?'<span class="xs mut">sin teléfono/correo</span>':''}</div>`}).join('');
  const m=modal(`${mhead('Pedir cotización')}<div class="xs mut" style="margin-bottom:8px">Se manda la lista de productos (sin precios). Cuando te contesten, escribe el precio en cada producto y elige a quién comprarle.</div><div class="list" style="max-height:55dvh;overflow:auto">${rows||'<div class="empty">No hay proveedores.</div>'}</div><div class="mf"><button class="btn pri" data-close>Listo</button></div>`)}
function compraNueva(){

    <div class="list" id="clines">${draft.lines.map((l,i)=>{const p=get('productos',l.pid)||{nombre:'(eliminado)'},ps=preciosDe(l.pid),best=ps[0],rows=rowsFor(l),libres=all('proveedores').filter(v=>!rows.some(r=>r.proveedor_id===v.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
      return`<div class="card flat"><div class="row"><div class="sp"><div class="b ell">${esc(p.nombre)}</div><div class="xs mut">Existencia ${qf(stockOf(l.pid))} ${esc(p.unidad||'')} · último costo ${money(p.costo)}</div></div><button class="btn sm ghost" data-rm="${i}">${ic('trash')}</button></div>
      <div class="row wrap" style="margin-top:8px;align-items:flex-end"><div class="field" style="max-width:170px"><label>Cantidad (${esc(lunit(l))})</label><input data-i="${i}" data-k="qty" type="number" step="any" inputmode="decimal" value="${l.qty}"></div>${presOf(p)?`<div class="seg"><button data-mode="${i}" data-m="pres" class="${l.mode==='pres'?'on':''}">${esc(presOf(p).n)} (${qf(presOf(p).c)} ${esc(p.unidad||'')})</button><button data-mode="${i}" data-m="base" class="${l.mode==='pres'?'':'on'}">${esc(p.unidad||'pza')}</button></div>`:''}${l.mode==='pres'?`<span class="xs mut">= ${qf(lq(l))} ${esc(p.unidad||'')} al inventario</span>`:''}</div>
      <div class="xs mut" style="margin:6px 0 2px">Elige a quién comprarle. Para anotar una cotización, escribe el precio que te dieron.</div>
      <div class="scroll-x"><table><tbody>${rows.map(r=>{const sel=r.proveedor_id===l.prov,isb=best&&r.proveedor_id===best.proveedor_id&&ps.length>1;return`<tr><td style="width:30px"><input type="radio" name="pk${i}" data-i="${i}" data-k="pick" data-pv="${r.proveedor_id}" ${sel?'checked':''}></td><td>${esc(provName(r.proveedor_id))} ${isb?'<span class="badge ok">Mejor</span>':''}<div class="xs mut">${r.fecha?esc(ageTxt(r.fecha)):'sin cotizar'}</div></td><td style="width:110px"><div class="xs mut">por ${esc(l.mode==='pres'?presOf(p).n.toLowerCase():p.unidad||'pza')}</div><input data-i="${i}" data-k="price" data-pv="${r.proveedor_id}" type="number" step="any" inputmode="decimal" placeholder="$ precio" value="${r.costo?Math.round(r.costo*lf(l)*100)/100:''}"></td></tr>`}).join('')}<tr><td><input type="radio" name="pk${i}" data-i="${i}" data-k="pick" data-pv="" ${!l.prov?'checked':''}></td><td class="mut" colspan="2">Aún no decido / sin proveedor</td></tr></tbody></table></div>
      ${libres.length?`<select data-i="${i}" data-k="extra" style="margin-top:6px"><option value="">+ Cotizar con otro proveedor…</option>${libres.map(v=>`<option value="${v.id}">${esc(v.nombre)}</option>`).join('')}</select>`:''}
      <div class="row" style="margin-top:8px"><span class="mut sm sp">${l.prov?esc(provName(l.prov)):'Sin proveedor'} · ${money((l.costo||0)*lf(l))} por ${esc(l.mode==='pres'?presOf(p).n.toLowerCase():p.unidad||'pza')}${l.mode==='pres'?` · ${money(l.costo||0)} por ${esc(p.unidad||'')}`:''}</span><span class="b num">${money(limp(l))}</span></div></div>`}).join('')||'<div class="empty">Agrega los productos que vas a comprar. Para cada uno verás los precios de tus proveedores, podrás anotar cotizaciones nuevas y elegir a quién comprarle.</div>'}</div>
    ${draft.lines.length?`<div class="card" style="margin-top:12px"><div class="fgrid"><div class="field"><label>Forma de pago</label><select id="cmet"><option value="efectivo" ${draft.metodo==='efectivo'?'selected':''}>Efectivo (sale de la caja)</option><option value="transferencia" ${draft.metodo==='transferencia'?'selected':''}>Transferencia</option><option value="credito" ${draft.metodo==='credito'?'selected':''}>A crédito (pendiente de pagar)</option></select></div><div class="field"><label>Nota</label><input id="cnota" value="${esc(draft.nota)}"></div></div>
    <div class="b" style="margin:12px 0 4px">Pedido por proveedor</div><div class="list" id="cgr">${groupsHTML()}</div><div class="tl big" style="margin:10px 0"><span>Total</span><span class="num">${money(total)}</span></div><div class="xs mut" style="margin-bottom:8px">Si eliges proveedores distintos se registra un pedido por cada proveedor.</div><div class="row wrap"><button class="btn pri lg" id="cped" style="flex:1">${ic('truck')} Guardar pedido (llega después)</button><button class="btn lg" id="csave" style="flex:1">${ic('check')} Ya llegó: recibir y pagar</button></div><div class="xs mut" style="margin-top:6px">"Guardar pedido" no mueve inventario ni caja. Cuando llegue la mercancía la revisas en la pestaña <b>Por recibir</b>, anotas faltantes o devoluciones y pagas.</div></div>`:''}`;
    $('#cadd').onclick=()=>pickProducto(addLine,{keep:true,title:'Agregar a la compra'});
    $('#cscan').onclick=()=>scanner(code=>{const p=all('productos').find(x=>x.codigo&&String(x.codigo)===code);if(p){addLine(p);toast('Agregado: '+p.nombre)}else toast('Código no encontrado: '+code,'bad')},{continuous:true,title:'Escanear para comprar'});
    $('#clow').onclick=()=>{const low=all('productos').filter(p=>p.activo!==0&&stStatus(p)!=='ok'&&!draft.lines.some(l=>l.pid===p.id));if(!low.length){toast('No hay productos bajos fuera de la lista')}low.forEach(p=>addLine(p,true));draw()};
    $('#clines').onclick=e=>{const mb=e.target.closest('[data-mode]');if(mb){const l=draft.lines[+mb.dataset.mode],pr=presOf(get('productos',l.pid));if(l&&pr&&l.mode!==mb.dataset.m){l.qty=Math.round((mb.dataset.m==='base'?l.qty*pr.c:l.qty/pr.c)*100)/100;l.mode=mb.dataset.m;draw()}return}const b=e.target.closest('[data-rm]');if(b){draft.lines.splice(+b.dataset.rm,1);draw()}};
    $('#clines').onchange=e=>{const t=e.target,l=draft.lines[+t.dataset.i];if(!l)return;const k=t.dataset.k;
      if(k==='pick'){l.prov=t.dataset.pv;const pr=preciosDe(l.pid).find(x=>x.proveedor_id===l.prov);l.costo=pr?pr.costo:(l.prov?0:l.costo);if(l.prov&&!pr)toast('Escribe el precio que te dio ese proveedor','warn')}
      else if(k==='price'){const pv=t.dataset.pv,v=Math.round(num(t.value)/lf(l)*10000)/10000;if(v>0){const was=mejorPrecio(l.pid);saveQuote(l.pid,pv,v);if(l.prov===pv)l.costo=v;const nb=mejorPrecio(l.pid);toast(nb&&nb.proveedor_id===pv&&(!was||was.proveedor_id!==pv||preciosDe(l.pid).length>1)?'Precio guardado · ¡es el más barato!':'Precio guardado')}}
      else if(k==='extra'){if(t.value){l.extra=(l.extra||[]).concat(t.value)}}
      else l[k]=num(t.value);
      draw()};
    $('#cprov').onclick=porProveedor;
    const ca=$('#cask');if(ca)ca.onclick=askQuote;
    const cg=$('#cgr');if(cg)cg.onclick=e=>{const b=e.target.closest('[data-send]');if(b)sendPedido(b.dataset.send)};
    const cm=$('#cmet');if(cm){cm.onchange=e=>draft.metodo=e.target.value;$('#cnota').oninput=e=>draft.nota=e.target.value;$('#csave').onclick=()=>saveCompra('recibir');$('#cped').onclick=()=>saveCompra('pedido')}};
  function addLine(p,silent){const ex=draft.lines.find(l=>l.pid===p.id);if(ex){ex.qty+=1}else{const mj=mejorPrecio(p.id);const sug=minOf(p)>0?Math.max(1,Math.ceil(minOf(p)*2-stockOf(p.id))):1;draft.lines.push(initMode({pid:p.id,qty:1,prov:mj?mj.proveedor_id:'',costo:mj?mj.costo:(+p.costo||0)},silent?sug:null))}if(!silent)draw()}
  async function saveCompra(modo){
    const ls=draft.lines.filter(l=>l.qty>0);if(!ls.length){toast('Agrega cantidades','warn');return}
    if(ls.some(l=>!(l.costo>=0))){toast('Revisa los costos','warn');return}
    let caja=null;if(modo!=='pedido'&&draft.metodo==='efectivo'){caja=await needCaja();if(!caja)return}
    const groups={};ls.forEach(l=>(groups[l.prov||'']=groups[l.prov||'']||[]).push(l));
    const nf=()=>{const n=(LS.get('cfolio',0)||0)+1;LS.set('cfolio',n);return(modo==='pedido'?'P-':'C-')+DEV+'-'+String(n).padStart(4,'0')};
    if(modo==='pedido'){Object.entries(groups).forEach(([prov,arr])=>{const items=arr.map(l=>{const p=get('productos',l.pid);return{pid:l.pid,nombre:p?p.nombre:'',unidad:p?p.unidad:'',qty:lq(l),costo:l.costo,importe:limp(l),pres:l.mode==='pres'?l.qty+' '+lunit(l):''}});save('compras',{id:uid(),folio:nf(),fecha:new Date().toISOString(),dia:today(),proveedor_id:prov,proveedor:prov?provName(prov):'',items,total:r2(sumBy(items,i=>i.importe)),metodo:'',pagada:0,estado:'pedido',nota:draft.nota,usuario_id:U().id,caja_id:''})});const n=Object.keys(groups).length;draft={lines:[],metodo:'efectivo',nota:''};toast(`Pedido guardado (${n} proveedor${n===1?'':'es'}). Aparece en "Por recibir".`);renderTop();compTab='rec';V.compras();return}
    Object.entries(groups).forEach(([prov,arr])=>{
      const items=arr.map(l=>{const p=get('productos',l.pid);return{pid:l.pid,nombre:p?p.nombre:'',unidad:p?p.unidad:'',qty:lq(l),costo:l.costo,importe:limp(l),pres:l.mode==='pres'?l.qty+' '+lunit(l):''}});
      const total=r2(sumBy(items,i=>i.importe));
      const c=save('compras',{id:uid(),folio:nf(),fecha:new Date().toISOString(),dia:today(),proveedor_id:prov,proveedor:prov?provName(prov):'',items,total,metodo:draft.metodo,pagada:draft.metodo==='credito'?0:1,nota:draft.nota,usuario_id:U().id,caja_id:caja?caja.id:''});
      items.forEach(i=>{addMov(i.pid,i.qty,'compra',c.id,c.folio);const p=get('productos',i.pid);if(p&&cfg().auto_costo==1&&i.costo>0){p.costo=i.costo;save('productos',p)}
        if(prov&&i.costo>0){let pr=all('precios_prov').find(x=>x.producto_id===i.pid&&x.proveedor_id===prov);if(pr)Object.assign(pr,{costo:i.costo,fecha:today()});else pr={id:uid(),producto_id:i.pid,proveedor_id:prov,costo:i.costo,fecha:today()};save('precios_prov',pr)}});
      if(caja)save('caja_mov',{id:uid(),caja_id:caja.id,tipo:'salida',concepto:'Compra '+c.folio+(prov?' · '+provName(prov):''),monto:total,fecha:new Date().toISOString(),usuario_id:U().id,compra_id:c.id})});
    const n=Object.keys(groups).length;const malos=ls.map(l=>get('productos',l.pid)).filter((x,i,a)=>x&&riesgoPrecio(x)&&a.indexOf(x)===i);draft={lines:[],metodo:'efectivo',nota:''};toast(`Compra registrada (${n} proveedor${n===1?'':'es'}). Inventario actualizado.`);if(malos.length){const mm=modal(`${mhead('Revisa estos precios')}<div class="sm">Con el nuevo costo, el precio de venta o de mayoreo quedó igual o por debajo de lo que te cuesta. Corrígelo para no perder:</div><div class="list">${malos.map(x=>`<button class="item" data-id="${x.id}"><div class="sp"><div class="b">${esc(x.nombre)}</div><div class="xs mut">Costo ${money(x.costo)} · Menudeo ${money(x.precio)} · Mayoreo ${money(x.mayoreo||0)}</div></div><span class="badge bad">Corregir</span></button>`).join('')}</div><div class="mf"><button class="btn pri" data-close>Luego</button></div>`);mm.el.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){mm.close();productForm(b.dataset.id)}})}renderTop();compTab='hist';V.compras()}
  draw()}
function compraPorRecibir(){
  const a=all('compras').filter(c=>c.estado==='pedido').sort((x,y)=>x.fecha<y.fecha?1:-1);
  $('#cbody').innerHTML=`<div class="list">${a.map(c=>`<button class="item" data-id="${c.id}"><div class="sp"><div class="b">${esc(c.proveedor||'Sin proveedor')} · ${esc(c.folio)}</div><div class="xs mut">Pedido ${fmtDT(c.fecha)} · ${(c.items||[]).length} producto(s)</div></div><div class="b num">${money(c.total)}</div><span class="badge warn">Por recibir</span></button>`).join('')||'<div class="empty">No tienes pedidos pendientes. Arma uno en "Nueva compra" y pulsa "Guardar pedido".</div>'}</div>`;
  $('#cbody').onclick=e=>{const b=e.target.closest('[data-id]');if(b)recibirPedido(get('compras',b.dataset.id))}}
function recibirPedido(c){
  if(!c)return;const its=(c.items||[]).map(i=>{const p=get('productos',i.pid),pr=presOf(p),f=i.pres&&pr?pr.c:1;return{i,f,u:f>1?pr.n.toLowerCase()+'(s)':(i.unidad||'pza'),qty:Math.round(i.qty/f*1000)/1000,pc:Math.round(i.costo*f*100)/100,ped:Math.round(i.qty/f*1000)/1000}});
  const body=()=>its.map((x,k)=>`<tr><td>${esc(x.i.nombre)}<div class="xs mut">Pedido: ${qf(x.ped)} ${esc(x.u)}</div></td><td style="width:100px"><input data-k="${k}" data-f="q" type="number" step="any" inputmode="decimal" value="${x.qty}"></td><td style="width:130px"><input data-k="${k}" data-f="c" type="number" step="any" inputmode="decimal" value="${x.pc}"><div class="xs mut">$ por ${esc(x.f>1?x.u.replace('(s)',''):x.i.unidad||'pza')}</div></td><td class="r num b" id="ti${k}">${money(x.qty*x.pc)}</td></tr>`).join('');
  const tot=()=>r2(sumBy(its,x=>x.qty*x.pc)),falt=()=>its.filter(x=>x.qty<x.ped);
  const m=modal(`${mhead('Recibir pedido · '+esc(c.proveedor||'Sin proveedor'))}<div class="xs mut">${esc(c.folio)} · pedido ${fmtDT(c.fecha)}. Revisa lo que llegó: baja la cantidad de lo que falta o devolviste y corrige el precio si la factura cambió.</div>
  <div class="scroll-x"><table><thead><tr><th>Producto</th><th>Recibido</th><th>Precio</th><th class="r">Importe</th></tr></thead><tbody id="rb">${body()}</tbody></table></div>
  <div class="tl big"><span>Total a pagar</span><span class="num" id="rt">${money(tot())}</span></div><div class="xs mut" id="rf"></div>
  <div class="fgrid"><div class="field"><label>Forma de pago</label><select id="rm"><option value="efectivo">Efectivo (sale de la caja)</option><option value="transferencia">Transferencia</option><option value="credito">Pagar después (queda por pagar)</option></select></div><div class="field"><label>Nota (devoluciones, faltantes…)</label><input id="rn" value="${esc(c.nota||'')}"></div></div>
  <div class="mf"><button class="btn bad" data-do="can" style="margin-right:auto">${ic('trash')} Cancelar pedido</button><button class="btn" data-do="wa">${ic('msg')} Reenviar</button><button class="btn" data-close>Cerrar</button><button class="btn pri" data-do="ok">${ic('check')} Recibir y pagar</button></div>`,{wide:true,sticky:true});
  const upd=()=>{m.q('#rt').textContent=money(tot());its.forEach((x,k)=>{const e=m.q('#ti'+k);if(e)e.textContent=money(x.qty*x.pc)});const f=falt();m.q('#rf').textContent=f.length?'Faltan o se devuelven: '+f.map(x=>`${qf(x.ped-x.qty)} ${x.u} de ${x.i.nombre}`).join(', '):''};
  m.el.addEventListener('input',e=>{const t=e.target;if(t.dataset.k===undefined)return;its[+t.dataset.k][t.dataset.f==='q'?'qty':'pc']=num(t.value);upd()});
  m.do.wa=()=>{const v=get('proveedores',c.proveedor_id);m.close();if(v)sendPedidoRec(c,v)};
  m.do.can=async()=>{if(await ask('¿Cancelar este pedido? No se mueve inventario ni caja.','Cancelar pedido',true)){c.estado='cancelado';save('compras',c);m.close();toast('Pedido cancelado');renderTop();compraPorRecibir()}};
  m.do.ok=async()=>{const met=m.q('#rm').value,ok=its.filter(x=>x.qty>0);
    if(!ok.length){if(await ask('No recibiste nada. ¿Cerrar el pedido como cancelado?','Cerrar',true)){c.estado='cancelado';save('compras',c);m.close();renderTop();V.compras()}return}
    let caja=null;if(met==='efectivo'){caja=await needCaja();if(!caja)return}
    const prov=c.proveedor_id;c.items=ok.map(x=>({...x.i,qty:Math.round(x.qty*x.f*1000)/1000,costo:Math.round(x.pc/x.f*10000)/10000,importe:r2(x.qty*x.pc),pres:x.f>1?x.qty+' '+x.u:'',pedido:Math.round(x.ped*x.f*1000)/1000}));
    c.total=r2(sumBy(c.items,i=>i.importe));c.metodo=met;c.pagada=met==='credito'?0:1;c.estado='recibida';c.fecha_pedido=c.fecha;c.fecha=new Date().toISOString();c.dia=today();c.nota=m.q('#rn').value;c.usuario_id=U().id;c.caja_id=caja?caja.id:'';save('compras',c);
    c.items.forEach(i=>{addMov(i.pid,i.qty,'compra',c.id,c.folio);const p=get('productos',i.pid);if(p&&cfg().auto_costo==1&&i.costo>0){p.costo=i.costo;save('productos',p)}
      if(prov&&i.costo>0)saveQuote(i.pid,prov,i.costo)});
    if(caja)save('caja_mov',{id:uid(),caja_id:caja.id,tipo:'salida',concepto:'Compra '+c.folio+(prov?' · '+provName(prov):''),monto:c.total,fecha:new Date().toISOString(),usuario_id:U().id,compra_id:c.id});
    const malos=c.items.map(i=>get('productos',i.pid)).filter((x,i,a)=>x&&riesgoPrecio(x)&&a.indexOf(x)===i);
    m.close();renderTop();toast('Pedido recibido. Inventario actualizado.');if(malos.length)toast('Revisa precios (quedaron debajo del costo): '+malos.map(x=>x.nombre).join(', '),'warn');compTab='hist';V.compras()}}
function sendPedidoRec(c,v){const text=`*Pedido · ${cfg().negocio}*\nPara: ${v.nombre}\n\n${(c.items||[]).map(i=>`• ${i.pres||qf(i.qty)+' '+(i.unidad||'pza')} ${i.nombre}`).join('\n')}\n\nGracias.`;shareModel('Pedido a '+v.nombre,pedidoModel(v.nombre,(c.items||[]).map(i=>({nombre:i.nombre,det:i.pres||(qf(i.qty)+' '+(i.unidad||'pza')),imp:i.importe>0?money(i.importe):''})),c.total,c.folio),text,{tel:v.telefono||'',email:v.email||'',subject:'Pedido · '+cfg().negocio})}
function compraHist(){
  const a=all('compras').filter(c=>c.estado!=='pedido'&&c.estado!=='cancelado').sort((x,y)=>x.fecha<y.fecha?1:-1).slice(0,100);
  $('#cbody').innerHTML=`<div class="list">${a.map(c=>`<button class="item" data-id="${c.id}"><div class="sp"><div class="b">${esc(c.folio)} · ${esc(c.proveedor||'Sin proveedor')}</div><div class="xs mut">${fmtDT(c.fecha)} · ${(c.items||[]).length} producto(s) · ${esc(METODOS[c.metodo]||c.metodo)}</div></div><div class="b num">${money(c.total)}</div><span class="badge ${c.pagada?'ok':'warn'}">${c.pagada?'Pagada':'Por pagar'}</span></button>`).join('')||'<div class="empty">Todavía no registras compras.</div>'}</div>`;
  $('#cbody').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const c=get('compras',b.dataset.id);

/* ============ inventario ============ */
let invTab='stock',invF='todos',invQ='';
V.inventario=arg=>{
  if(arg==='alertas'){invTab='stock';invF=alertCount().agotado?'agotado':'bajo'}
  $('#main').innerHTML=`<div class="hd"><h2>Inventario</h2><div class="seg" id="itab">${[['stock','Existencias'],['reab','Reabastecer'],['mov','Movimientos']].map(([k,l])=>`<button data-t="${k}" class="${invTab===k?'on':''}">${l}</button>`).join('')}</div></div><div id="ibody"></div>`;

function invStock(){

  <input id="iq" placeholder="Buscar producto o escanear código…" value="${esc(invQ)}" style="margin-bottom:10px"><div class="seg" id="ifil" style="margin-bottom:12px">${[['todos','Todos'],['bajo','Stock bajo'],['agotado','Agotados']].map(([k,l])=>`<button data-f="${k}" class="${invF===k?'on':''}">${l}</button>`).join('')}</div><div class="list" id="ilist"></div>`;
  const draw=()=>{const toks=norm(invQ).split(/\s+/).filter(Boolean);
    const a=ps.filter(p=>(!toks.length||toks.every(t=>norm(p.nombre+' '+(p.codigo||'')).includes(t)))&&(invF==='todos'||stStatus(p)===invF)).sort((x,y)=>stockOf(x.id)-stockOf(y.id)).slice(0,150);
    $('#ilist').innerHTML=a.map(p=>`<button class="item" data-id="${p.id}">${avatar(p)}<div class="sp"><div class="b ell">${esc(p.nombre)}</div><div class="xs mut">Mínimo ${qf(minOf(p))} ${esc(p.unidad||'')} · valor ${money(Math.max(0,stockOf(p.id))*(+p.costo||0))}</div></div>${stBadge(p)}<div class="r" style="min-width:70px"><div class="b num" style="font-size:18px">${qf(stockOf(p.id))}</div><div class="xs mut">${esc(p.unidad||'')}</div></div></button>`).join('')||'<div class="empty">Nada que mostrar.</div>'};
  draw();$('#iq').oninput=debounce(e=>{invQ=e.target.value;draw()},120);
  $('#iq').onkeydown=e=>{if(e.key==='Enter'){const p=all('productos').find(x=>x.codigo&&String(x.codigo)===e.target.value.trim());if(p)invItem(p)}};
  $('#ifil').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;invF=b.dataset.f;$$('#ifil button').forEach(x=>x.classList.toggle('on',x===b));draw()};
  $('#ilist').onclick=e=>{const b=e.target.closest('[data-id]');if(b)invItem(get('productos',b.dataset.id))}}
function invItem(p){const m=modal(`${mhead(esc(p.nombre))}<div class="row">${avatar(p,'lg')}<div class="sp"><div class="num b" style="font-size:34px">${qf(stockOf(p.id))} <span class="mut" style="font-size:16px">${esc(p.unidad||'')}</span></div>${stBadge(p)}</div></div><div class="list"><button class="btn" data-do="adj">${ic('edit')} Ajustar existencia (conteo, merma…)</button><button class="btn" data-do="kar">${ic('list')} Ver movimientos</button>${can('compras')?`<button class="btn" data-do="buy">${ic('truck')} Comprar este producto</button>`:''}${canEditCat()?`<button class="btn" data-do="edit">${ic('box')} Editar producto</button>`:''}</div>`);
  m.do.adj=()=>{m.close();adjustDialog(p)};m.do.kar=()=>{m.close();invTab='mov';invQ2=p.id;V.inventario()};m.do.buy=()=>{m.close();startCompra([{pid:p.id,qty:1}])};m.do.edit=()=>{m.close();productForm(p.id)}}
let invQ2='';
function adjustDialog(p){

function invReab(){
  const low=all('productos').filter(p=>p.activo!==0&&stStatus(p)!=='ok').sort((a,b)=>stockOf(a.id)-stockOf(b.id));

function invMov(){
  const pid=invQ2;let a=all('movimientos').sort((x,y)=>x.fecha<y.fecha?1:-1);if(pid)a=a.filter(x=>x.producto_id===pid);a=a.slice(0,150);

/* ============ ruta y visitas ============ */
let rutaDate=today(),rutaTab='pend',rutaUser='';
function ensureVisitasHoy(){const d=today(),wd=new Date().getDay();all('clientes').forEach(c=>{if(c.dia_visita===undefined||c.dia_visita===''||c.dia_visita===null||+c.dia_visita!==wd)return;const id='v-'+c.id+'-'+d;if(!mem.visitas.has(id))save('visitas',{id,cliente_id:c.id,fecha:d,estado:'pendiente',usuario_id:c.vendedor_id||'',auto:1})})}
function agendarVisita(cid){const m=modal(`${mhead('Agendar visita')}<div class="b">${esc((get('clientes',cid)||{}).nombre)}</div><div class="field"><label>Fecha</label><input id="avd" type="date" value="${today()}"></div><div class="field"><label>Asignar a</label><select id="avu"><option value="">Cualquiera</option>${all('usuarios').map(u=>`<option value="${u.id}" ${u.id===U().id?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select></div><div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn pri" data-do="ok">Agendar</button></div>`);
  m.do.ok=()=>{const f=m.q('#avd').value;if(!f)return;const id='v-'+cid+'-'+f,ex=get('visitas',id);if(ex&&ex.estado==='visitado'){toast('Ya fue visitado ese día','warn');return}save('visitas',Object.assign(ex||{id,cliente_id:cid,fecha:f},{estado:'pendiente',usuario_id:m.q('#avu').value}));m.close();toast('Visita agendada');if(view==='ruta')V.ruta()}}
V.ruta=async()=>{

  const pend=vs.filter(v=>v.estado==='pendiente'),vis=vs.filter(v=>v.estado==='visitado'),me=locFresh(900000);

  <div class="card flat" style="margin-bottom:12px"><div class="row"><b>${vis.length} de ${vs.length} visitados</b><span class="sp"></span><span class="mut sm">${me?'Ordenado por cercanía':'Activa tu ubicación para ordenar por cercanía'}</span></div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>
  <div class="seg" id="rt" style="margin-bottom:12px"><button data-t="pend" class="${rutaTab==='pend'?'on':''}">Pendientes (${pend.length})</button><button data-t="vis" class="${rutaTab==='vis'?'on':''}">Visitados (${vis.length})</button></div>
  <div class="list">${list.map(({v,c,d})=>{const s=saldoCliente(c.id),rp=routeUrl(c);return`<div class="card flat"><div class="row">${avatar(c)}<div class="sp"><div class="b ell">${esc(c.nombre)}</div><div class="xs mut">${esc(c.direccion||'Sin dirección')}</div><div class="xs">${d!=null?`<span class="badge ok">${fmtDist(d)}</span> `:''}${!hasLL(c)?'<span class="badge warn">sin ubicación</span> ':''}${s>0?`<span class="badge warn">debe ${money(s)}</span> `:''}${v.estado==='visitado'?`<span class="badge ok">${fmtDT(v.hora)}${v.usuario_id?' · '+esc((get('usuarios',v.usuario_id)||{}).nombre||''):''}</span>${v.dist!=null&&v.dist>300?` <span class="badge warn">check-in a ${fmtDist(v.dist)}</span>`:''}${v.nota?` <span class="mut">${esc(v.nota)}</span>`:''}`:''}</div></div></div>
  <div class="row wrap" style="margin-top:8px">${v.estado==='pendiente'?`<button class="btn pri sm" data-a="vis" data-id="${v.id}">${ic('check')} Visitar</button>`:''}${rp?`<a class="btn sm" href="${rp}" target="_blank" rel="noopener">${ic('nav')} Ir</a>`:''}<button class="btn sm" data-a="sell" data-c="${c.id}">${ic('cart')} Vender</button>${s>0?`<button class="btn sm acc" data-a="cob" data-c="${c.id}">${ic('wallet')} Cobrar</button>`:''}<button class="btn sm ghost" data-a="card" data-c="${c.id}">Ver cliente</button>${v.estado==='pendiente'?`<button class="btn sm ghost" data-a="rm" data-id="${v.id}" aria-label="Quitar">${ic('x')}</button>`:''}</div></div>`}).join('')||`<div class="empty">${rutaTab==='pend'?'No hay visitas pendientes para este día. Agenda visitas desde la ficha del cliente o asigna un día fijo.':'Aún no hay visitas registradas.'}</div>`}</div>
  ${isAdmin()?`<h3 style="margin:18px 0 8px">Equipo · última ubicación</h3><div class="list">${all('usuarios').filter(u=>u.activo!==0).map(u=>{const ago=u.ult_ts?Math.round((Date.now()-new Date(u.ult_ts))/60000):null;const vv=all('ventas').filter(x=>x.dia===today()&&x.usuario_id===u.id&&!x.cancelada);return`<div class="item" style="cursor:default">${avatar(u)}<div class="sp"><div class="b">${esc(u.nombre)}</div><div class="xs mut">${ago==null?'Sin ubicación registrada':ago<60?`Hace ${ago} min`:`Hace ${Math.round(ago/60)} h`} · ${vv.length} ventas hoy (${money(sumBy(vv,x=>x.total))})</div></div>${u.ult_lat?`<a class="btn sm" target="_blank" rel="noopener" href="${mapUrl({lat:u.ult_lat,lng:u.ult_lng})}">${ic('pin')} Ver mapa</a>`:''}</div>`}).join('')}</div>`:''}`;
  $('#rd').onchange=e=>{rutaDate=e.target.value||today();V.ruta()};const ru=$('#ru');if(ru)ru.onchange=e=>{rutaUser=e.target.value;V.ruta()};
  $('#rt').onclick=e=>{const b=e.target.closest('[data-t]');if(b){rutaTab=b.dataset.t;V.ruta()}};
  $('#rloc').onclick=async()=>{toast('Buscando ubicación…');const l=await getLoc();l?touchUserLoc(true):toast('No se pudo obtener la ubicación. Revisa los permisos del navegador.','bad');V.ruta()};

    if(a==='vis')visitDialog(b.dataset.id);

async function visitDialog(vid){

/* ============ cobranza (créditos y pendientes) ============ */
let cobQ='';
V.cobranza=arg=>{
  const vs=all('ventas').filter(v=>!v.cancelada&&v.saldo>0.004),groups={};
  vs.forEach(v=>(groups[v.cliente_id||'']=groups[v.cliente_id||'']||[]).push(v));
  const total=r2(sumBy(vs,v=>v.saldo));

  const draw=()=>{const q=norm(cobQ);

function toCSV(rows){return rows.map(r=>r.map(c=>{c=c==null?'':typeof c==='object'?JSON.stringify(c):String(c);return /[",\n\r;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n')}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';const cnt=ch=>(first.match(new RegExp(ch==='\t'?'\\t':'\\'+ch,'g'))||[]).length;
  const d=cnt('\t')>=Math.max(cnt(','),cnt(';'))&&cnt('\t')>0?'\t':cnt(';')>cnt(',')?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cur+=ch}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows}
const ALIAS={
  productos:{codigo:['codigo','codigo de barras','barras','sku','cod','ean'],nombre:['nombre','producto','descripcion','articulo'],categoria:['categoria','depto','departamento','linea','familia'],unidad:['unidad','um','medida'],granel:['granel','a granel'],costo:['costo','precio compra','precio de compra','costo unitario'],precio:['precio','precio venta','precio de venta','precio efectivo','menudeo','publico','precio publico','precio1'],mayoreo:['mayoreo','precio mayoreo','precio2'],min_mayoreo:['min mayoreo','min_mayoreo','minimo mayoreo','mayoreo desde','cantidad mayoreo'],stock_min:['stock min','stock_min','stock minimo','minimo','existencia minima'],stock_inicial:['stock','existencia','existencias','cantidad','inventario','stock inicial','stock_inicial'],proveedor:['proveedor'],pres_nombre:['presentacion','presentacion de compra','se compra por'],pres_cant:['contiene','contenido','piezas por caja','kg por bulto'],imagen:['imagen','foto','url imagen','url']},
  clientes:{nombre:['nombre','cliente','negocio','razon social'],telefono:['telefono','tel','celular','whatsapp','movil'],email:['email','correo','correo electronico','e-mail'],direccion:['direccion','domicilio','calle'],lat:['lat','latitud'],lng:['lng','lon','long','longitud'],tipo_precio:['tipo precio','tipo_precio','tipo de precio','precio'],limite_credito:['limite credito','limite_credito','limite','credito'],dia_visita:['dia visita','dia_visita','dia de visita','visita'],nota:['nota','notas','observaciones']},

  <label class="btn block">${ic('down')} Elegir archivo CSV<input type="file" id="ifile" accept=".csv,.tsv,.txt,text/csv" hidden></label><div class="field"><label>…o pega aquí los datos</label><textarea id="itxt" style="min-height:110px" placeholder="codigo,nombre,precio…"></textarea></div><div id="iprev"></div>
