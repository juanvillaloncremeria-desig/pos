  m.do.go=()=>{if(!parsed)return;const r=runImport(kind,parsed.rows,parsed.map);m.close();toast(`Importación lista: ${r.nuevos} nuevos, ${r.act} actualizados`);renderTop();({productos:'productos',clientes:'clientes',proveedores:'proveedores'})[kind]===view&&V[view]()}}
function runImport(kind,rows,map){
  let nuevos=0,act=0;const val=(row,f)=>{const i=map[f];return i===undefined?undefined:(row[i]??'').toString().trim()};
  for(const row of rows){const nombre=val(row,'nombre');if(!nombre)continue;
    if(kind==='productos'){
      const cod=val(row,'codigo');let p=(cod&&all('productos').find(x=>String(x.codigo)===cod))||all('productos').find(x=>norm(x.nombre)===norm(nombre));const isNew=!p;if(isNew)p={id:uid(),activo:1,unidad:'pza',granel:0};
      p.nombre=nombre;if(cod!==undefined&&cod!=='')p.codigo=cod;
      for(const f of['categoria','unidad','imagen']){const v=val(row,f);if(v)p[f]=v}
      for(const f of['costo','precio','mayoreo','min_mayoreo','stock_min']){const v=val(row,f);if(v!==undefined&&v!=='')p[f]=num(v)}
      {const pn=val(row,'pres_nombre'),pc=num(val(row,'pres_cant')||0);if(pn!==undefined||pc){if(pn&&pc>1){p.pres_nombre=pn.charAt(0).toUpperCase()+pn.slice(1).toLowerCase();p.pres_cant=pc}else if(pn===''&&!pc){p.pres_nombre='';p.pres_cant=0}}}
      const g=val(row,'granel');if(g!==undefined&&g!=='')p.granel=truthy(g)?1:0;
      const si=val(row,'stock_inicial');if(isNew&&si!==undefined&&si!==''&&num(si)>0)p.stock_inicial=num(si);
      save('productos',p);if(isNew&&p.stock_inicial)ensureInicial(p);
      const pv=val(row,'proveedor');if(pv){let v=all('proveedores').find(x=>norm(x.nombre)===norm(pv));if(!v)v=save('proveedores',{id:uid(),nombre:pv});if(+p.costo>0){let pr=all('precios_prov').find(x=>x.producto_id===p.id&&x.proveedor_id===v.id);if(pr)Object.assign(pr,{costo:p.costo,fecha:today()});else pr={id:uid(),producto_id:p.id,proveedor_id:v.id,costo:p.costo,fecha:today()};save('precios_prov',pr)}}
      isNew?nuevos++:act++}
    else{const tab=kind;let x=all(tab).find(y=>norm(y.nombre)===norm(nombre));const isNew=!x;if(isNew)x={id:uid()};x.nombre=nombre;
      for(const f of Object.keys(map)){if(f==='nombre')continue;let v=val(row,f);if(v===undefined||v==='')continue;
        if(f==='lat'||f==='lng'||f==='limite_credito')v=num(v);else if(f==='tipo_precio')v=norm(v).startsWith('may')?'mayoreo':'menudeo';else if(f==='dia_visita'){const i=DIAS.findIndex(d=>norm(d)===norm(v));v=i>=0?i:(/^[0-6]$/.test(v)?+v:'')}
        x[f]=v}
      save(tab,x);isNew?nuevos++:act++}}
  return{nuevos,act}}

const SYNC={state:'off',url:'',token:'',auto:true,pend:0,last:0,touch(){}};
const NUMF=new Set('updated deleted costo precio mayoreo min_mayoreo pres_cant stock_min stock_inicial lat lng limite_credito cantidad monto recargo cobrado total subtotal descuento saldo recibido cambio fondo contado esperado diferencia qty granel activo cancelada pagada recargo_tarjeta editar_precios vender_sin_stock auto_costo autoprint ult_lat ult_lng rastrear dist auto'.split(' '));

function syncCfg(){const c=LS.get('sync',{});SYNC.url=c.url||'';SYNC.token=c.token||'';SYNC.auto=c.auto!==0;SYNC.state=SYNC.url?(SYNC.state==='off'?'idle':SYNC.state):'off'}
const renderTopSoon=debounce(()=>{if(CU)renderTop()},300),schedSync=debounce(()=>syncNow(false),4000);
dirtyHook=()=>{SYNC.pend++;renderTopSoon();if(SYNC.url&&SYNC.auto)schedSync()};
async function sheetCall(body){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),90000);
  try{const res=await fetch(SYNC.url,{method:'POST',body:JSON.stringify({...body,token:SYNC.token,dev:DEV}),signal:ctl.signal,redirect:'follow'});const txt=await res.text();let j;try{j=JSON.parse(txt)}catch{throw new Error('La URL no respondió como el script. Revisa que sea la URL de la implementación web y que el acceso sea “Cualquier persona”.')}if(!j.ok)throw new Error(j.error||'Error del script');return j}
  catch(e){if(e.name==='AbortError')throw new Error('Tiempo de espera agotado');throw e}finally{clearTimeout(to)}}
let syncing=false;
async function syncNow(manual){
  if(!SYNC.url){if(manual)toast('Configura la URL de Google Sheets en Ajustes → Datos','warn');return}
  if(syncing)return;if(!navigator.onLine){if(manual)toast('Sin internet. Se sincronizará al reconectar.','warn');return}
  syncing=true;SYNC.state='busy';renderTop();
  try{
    const lp=LS.get('lastPush',0),startTs=Date.now();
    for(const t of TABLES){const recs=[...mem[t].values()].filter(r=>(r.updated||0)>lp);for(let i=0;i<recs.length;i+=40)await sheetCall({action:'push',changes:{[t]:recs.slice(i,i+40)}})}
    LS.set('lastPush',startTs);SYNC.pend=0;
    const r=await sheetCall({action:'pull',since:LS.get('lastSv',0)});let n=0;
    for(const t of TABLES){for(const raw of(r.changes&&r.changes[t])||[]){const rec=normRec(raw);if(!rec)continue;const loc0=mem[t].get(rec.id);if(!loc0||(rec.updated||0)>(loc0.updated||0)){if(!rec.updated)rec.updated=Date.now();save(t,rec,true);n++}}}
    LS.set('lastSv',r.now);SYNC.last=Date.now();SYNC.state='idle';
    if(n){rebuildStock();all('productos').forEach(ensureInicial);if(CU&&!modals.length){if(view==='pos'){renderCatalog();renderCats();renderCart()}else go(view)}}
    if(manual)toast(n?`Sincronizado: ${n} cambios recibidos`:'Sincronizado: todo al día')
  }catch(e){SYNC.state='err';SYNC.err=e.message;console.warn(e);if(manual)toast('No se pudo sincronizar: '+e.message,'bad')}
  finally{syncing=false;if(CU)renderTop();if(view==='ajustes'&&ajTab==='datos'&&!modals.length)ajDatos()}}

function userForm(id){
  const old=id?get('usuarios',id):null,u=old||{rol:'vendedor',activo:1};
  const m=modal(`${mhead(old?'Editar usuario':'Nuevo usuario')}<div class="field"><label>Nombre</label><input id="u_n" value="${esc(u.nombre||'')}"></div><div class="fgrid"><div class="field"><label>PIN (4 a 8 dígitos)${old?' · vacío = no cambiar':''}</label><input id="u_p" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="field"><label>Rol</label><select id="u_r">${['vendedor','cajero','admin'].map(r=>`<option value="${r}" ${u.rol===r?'selected':''}>${r==='admin'?'Administrador':r==='cajero'?'Cajero':'Vendedor'}</option>`).join('')}</select></div></div>
  <label class="row"><input type="checkbox" id="u_a" ${u.activo!==0?'checked':''}><span>Usuario activo</span></label><label class="row"><input type="checkbox" id="u_g" ${u.rastrear!==0?'checked':''}><span>Registrar su ubicación (ventas, visitas y equipo)</span></label>
  <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn pri" data-do="ok">Guardar</button></div>`);
  m.do.ok=()=>{const n=m.q('#u_n').value.trim(),p=m.q('#u_p').value.trim();if(!n){toast('Escribe el nombre','warn');return}
    if(!old&&!/^\d{4,8}$/.test(p)){toast('El PIN debe tener de 4 a 8 números','warn');return}if(p&&!/^\d{4,8}$/.test(p)){toast('El PIN debe tener de 4 a 8 números','warn');return}
    const rol=m.q('#u_r').value,act=m.q('#u_a').checked?1:0;
    if(old&&old.rol==='admin'&&(rol!=='admin'||!act)&&all('usuarios').filter(x=>x.rol==='admin'&&x.activo!==0&&x.id!==old.id).length===0){toast('Debe quedar al menos un administrador activo','bad');return}
    const rec=Object.assign(old||{id:uid()},{nombre:n,rol,activo:act,rastrear:m.q('#u_g').checked?1:0});if(p)rec.pin=hashPin(p);save('usuarios',rec);if(CU&&rec.id===CU.id)CU=rec;m.close();toast('Usuario guardado');ajUsuarios()}}
function ajDatos(){
  const keep=$('#abody');const scroll=$('#main').scrollTop;
  keep.innerHTML=`<div class="grid g2" style="align-items:start">
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>${ic('cloud')} Google Sheets (respaldo y sincronización)</h3>
   <div class="field"><label>URL de la aplicación web (Apps Script)</label><input id="s_url" value="${esc(SYNC.url)}" placeholder="https://script.google.com/macros/s/…/exec"></div><div class="field"><label>Clave (la misma que pusiste en el script)</label><input id="s_tok" value="${esc(SYNC.token)}" type="password" autocomplete="off"></div>
   <label class="row"><input type="checkbox" id="s_auto" ${SYNC.auto?'checked':''}><span>Sincronizar automáticamente (cada cambio y cada 2 minutos)</span></label>
   <div class="row wrap"><button class="btn pri" id="s_save">Guardar y sincronizar</button><button class="btn" id="s_up">Subir todo de nuevo</button><button class="btn" id="s_down">Descargar todo de nuevo</button></div>
   <div class="sm ${SYNC.state==='err'?'':'mut'}" style="${SYNC.state==='err'?'color:var(--bad)':''}">${SYNC.state==='err'?'Error: '+esc(SYNC.err||''):SYNC.url?(SYNC.last?'Última sincronización: '+fmtDT(new Date(SYNC.last).toISOString()):'Aún no se sincroniza en esta sesión.'):'Sin configurar. Sigue los pasos de abajo.'} ${SYNC.pend?'· '+SYNC.pend+' cambios por enviar':''}</div>
   <details><summary class="b" style="cursor:pointer">Cómo conectar tu hoja de Google (5 pasos)</summary><ol class="sm" style="padding-left:18px;line-height:1.6"><li>Crea una hoja de cálculo nueva en tu Drive (o abre la que ya usas).</li><li>Menú <b>Extensiones → Apps Script</b>. Borra lo que haya y pega el contenido del archivo <b>Code.gs</b> que te entregué. Cambia <code>CLAVE</code> por una contraseña tuya.</li><li>Presiona <b>Ejecutar → configurar</b> y acepta los permisos (crea las pestañas de datos).</li><li><b>Implementar → Nueva implementación → Aplicación web</b>. Ejecutar como: <i>Yo</i>. Quién tiene acceso: <i>Cualquier persona</i>. Copia la URL.</li><li>Pega la URL y la clave aquí y toca <b>Guardar y sincronizar</b>. Repite en cada celular/PC con la misma URL.</li></ol></details></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>${ic('down')} Importar datos</h3><div class="sm mut">Desde CSV o pegando celdas de tu Google Sheets / Excel.</div><div class="row wrap"><button class="btn" data-i="productos">Productos</button><button class="btn" data-i="clientes">Clientes</button><button class="btn" data-i="proveedores">Proveedores</button></div>
   <h3 style="margin-top:6px">Exportar y respaldo</h3><div class="row wrap"><button class="btn" data-e="productos">Productos CSV</button><button class="btn" data-e="clientes">Clientes CSV</button><button class="btn" data-e="proveedores">Proveedores CSV</button><button class="btn" data-e="ventas">Ventas CSV</button></div><div class="row wrap"><button class="btn pri" id="bk">Descargar respaldo completo (.json)</button><label class="btn">Restaurar respaldo<input type="file" id="bkf" accept=".json,application/json" hidden></label></div>
   <h3 style="margin-top:6px">Otros</h3><div class="sm mut">Versión de la app: ${APP_VER}</div><div class="row wrap"><button class="btn" id="upd">Buscar actualización</button><button class="btn" id="smp">Cargar datos de ejemplo</button><button class="btn bad" id="wipe">Borrar todos los datos de este dispositivo</button></div></div></div>`;
  $('#s_save').onclick=()=>{LS.set('sync',{url:$('#s_url').value.trim(),token:$('#s_tok').value.trim(),auto:$('#s_auto').checked?1:0});syncCfg();renderTop();syncNow(true)};
  $('#s_up').onclick=async()=>{if(!SYNC.url){toast('Configura la URL primero','warn');return}LS.set('lastPush',0);syncNow(true)};
  $('#s_down').onclick=()=>{if(!SYNC.url){toast('Configura la URL primero','warn');return}LS.set('lastSv',0);syncNow(true)};
  keep.onclick=e=>{const i=e.target.closest('[data-i]'),x=e.target.closest('[data-e]');if(i)importDialog(i.dataset.i);else if(x)exportTable(x.dataset.e)};
  $('#bk').onclick=()=>{const o={app:'cremeria-pos',version:1,fecha:new Date().toISOString(),tablas:{}};TABLES.forEach(t=>o.tablas[t]=[...mem[t].values()]);download(`respaldo_pos_${today()}.json`,JSON.stringify(o),'application/json')};
  $('#bkf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.tablas)throw 0;if(!await ask('Esto reemplaza los datos de este dispositivo con el respaldo. ¿Continuar?','Restaurar',true))return;await wipeAll();for(const t of TABLES)(o.tablas[t]||[]).forEach(r=>save(t,r,true));LS.set('lastPush',0);rebuildStock();toast('Respaldo restaurado');const u=get('usuarios',CU&&CU.id);if(!u)logout();else{CU=u;renderShell();go('ajustes','datos')}}catch{toast('Archivo de respaldo no válido','bad')}};
  $('#upd').onclick=async()=>{try{toast('Actualizando…');const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.href=location.pathname+'?v='+Date.now()};
  $('#smp').onclick=async()=>{if(await ask('Se agregarán productos, proveedores y clientes de ejemplo.','Cargar'))loadSample()};
  $('#wipe').onclick=async()=>{const t=await askInput('Borrar todo','Escribe BORRAR para confirmar. Los datos en Google Sheets no se tocan.');if(t==='BORRAR'){await wipeAll();LS.set('lastPush',0);LS.set('lastSv',0);stk.clear();save('usuarios',{id:'u-admin',nombre:'Administrador',pin:hashPin('1234'),rol:'admin',activo:1,updated:0},true);toast('Datos borrados');logout()}};
  $('#main').scrollTop=scroll}
function exportTable(k){
  if(k==='ventas'){const rows=[['folio','fecha','cliente','vendedor','estado','subtotal','descuento','total','saldo']].concat(all('ventas').map(v=>[v.folio,v.fecha,v.cliente_nombre||'',(get('usuarios',v.usuario_id)||{}).nombre||'',v.estado,v.subtotal,v.descuento,v.total,v.saldo]));download('ventas.csv','﻿'+toCSV(rows),'text/csv');return}
  const cols={productos:['codigo','nombre','categoria','unidad','granel','costo','precio','mayoreo','min_mayoreo','stock_min','activo'],clientes:['nombre','telefono','email','direccion','lat','lng','tipo_precio','limite_credito','dia_visita','nota'],proveedores:['nombre','contacto','telefono','email','direccion','nota']}[k];
  const rows=[k==='productos'?[...cols,'existencia']:cols].concat(all(k).map(r=>{const a=cols.map(c=>r[c]);if(k==='productos')a.push(stockOf(r.id));return a}));download(k+'.csv','﻿'+toCSV(rows),'text/csv')}

/* ============ datos de ejemplo ============ */

  const pv={};[['Lácteos La Granja','Sr. Ramírez','5551110001','Parque Industrial, Nave 4'],['Distribuidora Abarrotera del Centro','Lic. Torres','5551110002','Central de Abasto, bodega 118'],['Mayorista Express','Ana Ruiz','5551110003','Av. Reforma 220'],['Carnes Frías Don Beto','Beto','5551110004','Mercado Norte, local 9']].forEach(([n,c,t,d])=>{pv[n]=save('proveedores',{id:uid(),nombre:n,contacto:c,telefono:t,direccion:d})});
  const P=[['7501000000011','Queso fresco','Lácteos','kg',1,95,130,118,3,4,12,'Lácteos La Granja',.97],['7501000000028','Queso Oaxaca','Lácteos','kg',1,140,185,170,3,3,8,'Lácteos La Granja',.98],['7501000000035','Panela','Lácteos','kg',1,110,150,138,3,3,6,'Lácteos La Granja',1],['7501000000042','Crema 1 L','Lácteos','pza',0,38,52,47,6,6,20,'Lácteos La Granja',.96],['7501000000059','Leche entera 1 L','Lácteos','pza',0,19,24,22,12,12,36,'Lácteos La Granja',1],['7501000000066','Yogurt natural 1 L','Lácteos','pza',0,28,38,34,6,6,10,'Lácteos La Granja',1],['7501000000073','Requesón 500 g','Lácteos','pza',0,30,42,38,6,6,3,'Lácteos La Granja',1],['7501000000080','Mantequilla 90 g','Lácteos','pza',0,16,22,20,10,8,0,'Lácteos La Granja',1],['7501000000097','Jamón de pavo','Embutidos','kg',1,120,165,150,2,2,5,'Carnes Frías Don Beto',1],
  ['7501000000103','Frijol negro','Abarrotes','kg',1,28,38,34,10,10,40,'Distribuidora Abarrotera del Centro',1],['7501000000110','Arroz','Abarrotes','kg',1,20,28,25,10,10,35,'Distribuidora Abarrotera del Centro',1],['7501000000127','Azúcar','Abarrotes','kg',1,22,29,26,10,10,50,'Mayorista Express',1.03],['7501000000134','Lentejas','Abarrotes','kg',1,26,36,32,5,5,15,'Distribuidora Abarrotera del Centro',1],['7501000000141','Huevo','Abarrotes','kg',1,38,50,46,5,6,18,'Mayorista Express',.98],['7501000000158','Aceite 1 L','Abarrotes','pza',0,36,48,44,6,6,24,'Distribuidora Abarrotera del Centro',1],['7501000000165','Refresco cola 600 ml','Bebidas','pza',0,13,18,16,12,12,48,'Mayorista Express',1],['7501000000172','Agua 1 L','Bebidas','pza',0,9,13,11,12,12,30,'Mayorista Express',1],['7501000000189','Galletas Marías 170 g','Abarrotes','pza',0,12,17,15,10,8,22,'Distribuidora Abarrotera del Centro',1],['7501000000196','Atún en lata','Abarrotes','pza',0,17,24,22,12,10,30,'Mayorista Express',1],['7501000000202','Sal 1 kg','Abarrotes','pza',0,10,15,13,6,6,12,'Distribuidora Abarrotera del Centro',1],['7501000000219','Café soluble 100 g','Abarrotes','pza',0,45,62,56,6,5,4,'Mayorista Express',1],['7501000000226','Papel higiénico 4 pzas','Limpieza','paq',0,28,38,34,6,6,14,'Mayorista Express',1]];
  let n=0;P.forEach(([codigo,nombre,categoria,unidad,granel,costo,precio,mayoreo,min_mayoreo,stock_min,stock,prov,k])=>{

    const p=save('productos',{id:uid(),codigo,nombre,categoria,unidad,granel,costo,precio,mayoreo,min_mayoreo,stock_min,activo:1,stock_inicial:stock||undefined});if(stock>0)ensureInicial(p);
    save('precios_prov',{id:uid(),producto_id:p.id,proveedor_id:pv[prov].id,costo:r2(costo*k),fecha:today()});

  rebuildStock();toast(`Datos de ejemplo cargados (${n} productos nuevos)`);renderTop();if(view==='ajustes')V.ajustes()}

/* ============ arranque ============ */
async function boot(){
  await loadAll();
  if(!all('usuarios').length&&!mem.usuarios.has('u-admin'))save('usuarios',{id:'u-admin',nombre:'Administrador',pin:hashPin('1234'),rol:'admin',activo:1,updated:0},true);
  rebuildStock();all('productos').forEach(ensureInicial);syncCfg();
  const ses=LS.get('ses'),u=ses&&get('usuarios',ses);
  if(u&&u.activo!==0){CU=u;boot2()}else loginScreen();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){const had=!!navigator.serviceWorker.controller;let rl=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{})}
}
boot().catch(e=>{document.getElementById('root').innerHTML='<div style="padding:20px"><h2>No se pudo iniciar</h2><pre>'+esc(e&&e.stack||e)+'</pre></div>'});

</script>
